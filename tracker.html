    <script>
        // ============================================================
        // SECTION 1: WebGL GPU Filter Engine (GLSL Shaders)
        // ============================================================
        class WebGLFilterEngine {
            constructor() {
                this.canvas = document.createElement('canvas');
                const opts = { preserveDrawingBuffer: true, antialias: false, alpha: false, premultipliedAlpha: false };
                this.gl = this.canvas.getContext('webgl2', opts)
                    || this.canvas.getContext('webgl', opts)
                    || this.canvas.getContext('experimental-webgl', opts);
                this.supported = !!this.gl;
                this.programs = {};
                this.posBuffer = null;
                this.texBuffer = null;
                this.texture = null;
                this.cropCanvas = document.createElement('canvas');
                this.cropCtx = this.cropCanvas.getContext('2d');
                this.startTime = performance.now();

                if (this.supported) {
                    this._initBuffers();
                    this._compileAllShaders();
                }
            }

            // Vertex Shader (Quad Layar Penuh)
            _vertexSrc() {
                return `
            attribute vec2 a_pos;
            attribute vec2 a_tex;
            varying vec2 v_uv;
            void main() {
                gl_Position = vec4(a_pos, 0.0, 1.0);
                v_uv = a_tex;
            }
        `;
            }

            // Fragment Shader Per Efek (Dijalankan di GPU Mali-G68)
            _fragmentSrc(type) {
                const H = `precision highp float;
            varying vec2 v_uv;
            uniform sampler2D u_tex;
            uniform vec2 u_res;
            uniform float u_time;`;

                const shaders = {
                    none: `void main(){ gl_FragColor = texture2D(u_tex, v_uv); }`,

                    invert: `void main(){
                vec4 c = texture2D(u_tex, v_uv);
                gl_FragColor = vec4(1.0 - c.rgb, c.a);
            }`,

                    thermal: `void main(){
                float l = dot(texture2D(u_tex, v_uv).rgb, vec3(0.299, 0.587, 0.114));
                vec3 col;
                if(l < 0.25) col = vec3(0.0, l * 0.8, l * 4.0);
                else if(l < 0.5) col = vec3((l - 0.25) * 4.0, 0.0, 1.0 - (l - 0.25) * 4.0);
                else if(l < 0.75) col = vec3(1.0, (l - 0.5) * 4.0, 0.0);
                else col = vec3(1.0, 1.0, (l - 0.75) * 4.0);
                gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
            }`,

                    glitch: `void main(){
                float t = u_time * 0.001;
                float blk = floor(t * 8.0);
                float ln = step(0.92, fract(sin(v_uv.y * 73.0 + blk) * 4375.23));
                float sh = ln * sin(t * 25.0) * 0.055;
                float r = texture2D(u_tex, vec2(clamp(v_uv.x + sh, 0.0, 1.0), v_uv.y)).r;
                float g = texture2D(u_tex, v_uv).g;
                float b = texture2D(u_tex, vec2(clamp(v_uv.x - sh, 0.0, 1.0), v_uv.y)).b;
                gl_FragColor = vec4(r, g, b, 1.0);
            }`,

                    crt: `void main(){
                vec2 uv = v_uv;
                float scan = sin(uv.y * u_res.y * 3.14159 * 0.65) * 0.06;
                vec2 ts = vec2(2.0 / u_res.x, 0.0);
                float r = texture2D(u_tex, uv - ts).r;
                float g = texture2D(u_tex, uv).g;
                float b = texture2D(u_tex, uv + ts).b;
                float dark = 1.0 - abs(scan) * 1.5;
                gl_FragColor = vec4(r * dark, g * dark, b * dark, 1.0);
            }`,

                    nightvision: `void main(){
                vec2 uv = v_uv;
                float l = dot(texture2D(u_tex, uv).rgb, vec3(0.299, 0.587, 0.114));
                float dist = length(uv - vec2(0.5));
                float vig = 1.0 - smoothstep(0.38, 0.72, dist);
                float n = fract(sin(dot(uv + u_time * 0.00007, vec2(12.9898, 78.233))) * 43758.5453);
                float g = clamp(l * 1.85 + (n - 0.5) * 0.13, 0.0, 1.0) * vig;
                gl_FragColor = vec4(0.0, g, g * 0.28, 1.0);
            }`,

                    edge: `void main(){
                vec2 ts = 1.0 / u_res;
                float tl = dot(texture2D(u_tex, v_uv + vec2(-ts.x, -ts.y)).rgb, vec3(0.333));
                float tm = dot(texture2D(u_tex, v_uv + vec2(0.0, -ts.y)).rgb, vec3(0.333));
                float tr = dot(texture2D(u_tex, v_uv + vec2(ts.x, -ts.y)).rgb, vec3(0.333));
                float ml = dot(texture2D(u_tex, v_uv + vec2(-ts.x, 0.0)).rgb, vec3(0.333));
                float mr = dot(texture2D(u_tex, v_uv + vec2(ts.x, 0.0)).rgb, vec3(0.333));
                float bl = dot(texture2D(u_tex, v_uv + vec2(-ts.x, ts.y)).rgb, vec3(0.333));
                float bm = dot(texture2D(u_tex, v_uv + vec2(0.0, ts.y)).rgb, vec3(0.333));
                float br = dot(texture2D(u_tex, v_uv + vec2(ts.x, ts.y)).rgb, vec3(0.333));
                float gx = -tl - 2.0 * ml - bl + tr + 2.0 * mr + br;
                float gy = -tl - 2.0 * tm - tr + bl + 2.0 * bm + br;
                float e = min(1.0, sqrt(gx * gx + gy * gy) * 4.0);
                gl_FragColor = vec4(vec3(e), 1.0);
            }`,

                    xray: `void main(){
                float l = dot(texture2D(u_tex, v_uv).rgb, vec3(0.299, 0.587, 0.114));
                float x = 1.0 - l;
                gl_FragColor = vec4(clamp(x * 1.2, 0.0, 1.0), clamp(x * 1.5 + 0.08, 0.0, 1.0), clamp(x * 1.5 + 0.2, 0.0, 1.0), 1.0);
            }`,

                    water: `void main(){
                float wave = sin(v_uv.y * 38.0 + u_time * 0.005) * 0.009;
                gl_FragColor = texture2D(u_tex, vec2(clamp(v_uv.x + wave, 0.0, 1.0), v_uv.y));
            }`,

                    tone: `void main(){
                float l = dot(texture2D(u_tex, v_uv).rgb, vec3(0.299, 0.587, 0.114));
                gl_FragColor = vec4(min(1.0, l + 0.235), min(1.0, l + 0.118), max(0.0, l - 0.078), 1.0);
            }`,

                    mask: `void main(){
                vec4 c = texture2D(u_tex, v_uv);
                gl_FragColor = vec4(c.rgb * 0.18, 1.0);
            }`,

                    dither: `float bayerVal(float i){
                if(i < 0.5) return 0.0/16.0;
                else if(i < 1.5) return 8.0/16.0;
                else if(i < 2.5) return 2.0/16.0;
                else if(i < 3.5) return 10.0/16.0;
                else if(i < 4.5) return 12.0/16.0;
                else if(i < 5.5) return 4.0/16.0;
                else if(i < 6.5) return 14.0/16.0;
                else if(i < 7.5) return 6.0/16.0;
                else if(i < 8.5) return 3.0/16.0;
                else if(i < 9.5) return 11.0/16.0;
                else if(i < 10.5) return 1.0/16.0;
                else if(i < 11.5) return 9.0/16.0;
                else if(i < 12.5) return 15.0/16.0;
                else if(i < 13.5) return 7.0/16.0;
                else if(i < 14.5) return 13.0/16.0;
                else return 5.0/16.0;
            }
            void main(){
                float l = dot(texture2D(u_tex, v_uv).rgb, vec3(0.299, 0.587, 0.114));
                float bx = floor(mod(gl_FragCoord.x, 4.0));
                float by = floor(mod(gl_FragCoord.y, 4.0));
                float threshold = bayerVal(by * 4.0 + bx);
                float bw = step(threshold, l);
                gl_FragColor = vec4(vec3(bw), 1.0);
            }`,

                    pixelate: `void main(){
                float pixels = max(4.0, min(u_res.x, u_res.y) * 0.04);
                vec2 uv = floor(v_uv * pixels) / pixels;
                gl_FragColor = texture2D(u_tex, uv);
            }`,

                    blur: `void main(){
                vec2 ts = 2.5 / u_res;
                vec4 col = vec4(0.0);
                col += texture2D(u_tex, v_uv + vec2(-ts.x, -ts.y)) * 0.0625;
                col += texture2D(u_tex, v_uv + vec2(0.0, -ts.y)) * 0.125;
                col += texture2D(u_tex, v_uv + vec2(ts.x, -ts.y)) * 0.0625;
                col += texture2D(u_tex, v_uv + vec2(-ts.x, 0.0)) * 0.125;
                col += texture2D(u_tex, v_uv) * 0.25;
                col += texture2D(u_tex, v_uv + vec2(ts.x, 0.0)) * 0.125;
                col += texture2D(u_tex, v_uv + vec2(-ts.x, ts.y)) * 0.0625;
                col += texture2D(u_tex, v_uv + vec2(0.0, ts.y)) * 0.125;
                col += texture2D(u_tex, v_uv + vec2(ts.x, ts.y)) * 0.0625;
                gl_FragColor = col;
            }`,

                    zoom: `void main(){
                vec2 uv = (v_uv - 0.5) * 0.68 + 0.5;
                uv = clamp(uv, 0.0, 1.0);
                gl_FragColor = texture2D(u_tex, uv);
            }`
                };

                return H + '\n' + (shaders[type] || shaders.none);
            }

            _compileShader(src, type) {
                const gl = this.gl;
                const shader = gl.createShader(type);
                gl.shaderSource(shader, src);
                gl.compileShader(shader);
                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    console.warn('Shader compile error:', gl.getShaderInfoLog(shader));
                    gl.deleteShader(shader);
                    return null;
                }
                return shader;
            }

            _createProgram(vsSrc, fsSrc) {
                const gl = this.gl;
                const vs = this._compileShader(vsSrc, gl.VERTEX_SHADER);
                const fs = this._compileShader(fsSrc, gl.FRAGMENT_SHADER);
                if (!vs || !fs) return null;
                const prog = gl.createProgram();
                gl.attachShader(prog, vs);
                gl.attachShader(prog, fs);
                gl.linkProgram(prog);
                if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
                    console.warn('Program link error:', gl.getProgramInfoLog(prog));
                    return null;
                }
                prog._aPos = gl.getAttribLocation(prog, 'a_pos');
                prog._aTex = gl.getAttribLocation(prog, 'a_tex');
                prog._uTex = gl.getUniformLocation(prog, 'u_tex');
                prog._uRes = gl.getUniformLocation(prog, 'u_res');
                prog._uTime = gl.getUniformLocation(prog, 'u_time');
                return prog;
            }

            _initBuffers() {
                const gl = this.gl;
                this.posBuffer = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, this.posBuffer);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

                this.texBuffer = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, this.texBuffer);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 1, 1, 1, 0, 0, 1, 0]), gl.STATIC_DRAW);

                this.texture = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, this.texture);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            }

            _compileAllShaders() {
                const types = ['none', 'invert', 'thermal', 'glitch', 'crt', 'nightvision',
                    'edge', 'xray', 'water', 'tone', 'mask', 'dither', 'pixelate', 'blur', 'zoom'];
                const vs = this._vertexSrc();
                types.forEach(t => {
                    const prog = this._createProgram(vs, this._fragmentSrc(t));
                    if (prog) this.programs[t] = prog;
                });
            }

            // Render Global Shader via GPU
            render(filterType, source, destCtx, dx, dy, dw, dh) {
                if (!this.supported || !this.programs[filterType] || dw <= 0 || dh <= 0) {
                    this._cpuFallback(filterType, source, destCtx, dx, dy, dw, dh);
                    return;
                }
                const gl = this.gl;
                if (this.canvas.width !== dw || this.canvas.height !== dh) {
                    this.canvas.width = dw;
                    this.canvas.height = dh;
                    gl.viewport(0, 0, dw, dh);
                }

                gl.bindTexture(gl.TEXTURE_2D, this.texture);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);

                const prog = this.programs[filterType];
                gl.useProgram(prog);

                gl.bindBuffer(gl.ARRAY_BUFFER, this.posBuffer);
                gl.enableVertexAttribArray(prog._aPos);
                gl.vertexAttribPointer(prog._aPos, 2, gl.FLOAT, false, 0, 0);

                gl.bindBuffer(gl.ARRAY_BUFFER, this.texBuffer);
                gl.enableVertexAttribArray(prog._aTex);
                gl.vertexAttribPointer(prog._aTex, 2, gl.FLOAT, false, 0, 0);

                gl.uniform1i(prog._uTex, 0);
                gl.uniform2f(prog._uRes, dw, dh);
                gl.uniform1f(prog._uTime, performance.now() - this.startTime);

                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                destCtx.drawImage(this.canvas, dx, dy, dw, dh);
            }

            // Render Local Box Filter via GPU (Crop & Process)
            renderCrop(filterType, sourceCanvas, destCtx, sx, sy, sw, sh, dx, dy) {
                if (sw <= 0 || sh <= 0) return;
                this.cropCanvas.width = sw;
                this.cropCanvas.height = sh;
                this.cropCtx.drawImage(sourceCanvas, sx, sy, sw, sh, 0, 0, sw, sh);
                this.render(filterType, this.cropCanvas, destCtx, dx, dy, sw, sh);
            }

            // CPU Fallback otomatis jika WebGL crash/tidak didukung
            _cpuFallback(type, source, destCtx, dx, dy, dw, dh) {
                this.cropCanvas.width = dw;
                this.cropCanvas.height = dh;
                this.cropCtx.drawImage(source, 0, 0, dw, dh);
                if (type === 'blur') {
                    this.cropCtx.filter = 'blur(10px)';
                    this.cropCtx.drawImage(source, 0, 0, dw, dh);
                    this.cropCtx.filter = 'none';
                } else if (type !== 'none') {
                    try {
                        const id = this.cropCtx.getImageData(0, 0, dw, dh);
                        const d = id.data;
                        for (let i = 0; i < d.length; i += 4) {
                            if (type === 'invert') { d[i] = 255 - d[i]; d[i + 1] = 255 - d[i + 1]; d[i + 2] = 255 - d[i + 2]; }
                            else if (type === 'mask') { d[i] *= 0.18; d[i + 1] *= 0.18; d[i + 2] *= 0.18; }
                            else if (type === 'tone') { const l = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114); d[i] = Math.min(255, l + 60); d[i + 1] = Math.min(255, l + 30); d[i + 2] = Math.max(0, l - 20); }
                        }
                        this.cropCtx.putImageData(id, 0, 0);
                    } catch (e) { }
                }
                destCtx.drawImage(this.cropCanvas, dx, dy);
            }
        }

        // ============================================================
        // SECTION 2: State & GPU Verification
        // ============================================================
        const GPU = new WebGLFilterEngine();

        const gpuEl = document.getElementById('gpuIndicator');
        if (GPU.supported) {
            gpuEl.textContent = 'GPU:ON';
            gpuEl.style.background = 'rgba(16,185,129,0.15)';
            gpuEl.style.color = '#10B981';
            gpuEl.style.border = '1px solid rgba(16,185,129,0.4)';
        } else {
            gpuEl.textContent = 'GPU:OFF';
            gpuEl.style.background = 'rgba(239,68,68,0.15)';
            gpuEl.style.color = '#EF4444';
            gpuEl.style.border = '1px solid rgba(239,68,68,0.4)';
        }

        function $id(id) { return document.getElementById(id); }
        function setElDisplay(id, val) { const el = $id(id); if (el) el.style.display = val; }
        function setElText(id, text) { const el = $id(id); if (el) el.textContent = text; }
        function showMsg(title, desc) { setElText('msgTitle', title); setElText('msgDesc', desc); setElDisplay('msgBox', 'block'); }

        const video = $id("webcam");
        const canvas = $id("videoCanvas");
        const ctx = canvas ? canvas.getContext("2d") : null;

        // Offscreen canvas untuk multi-pass compositing
        const cleanCanvas = document.createElement('canvas');
        const cleanCtx = cleanCanvas.getContext('2d');

        let isTracking = false, isStaticMedia = false, isRecording = false;
        let trackedFaces = [], poseLandmarks = null, nextFaceId = 1, lastFrameTime = 0, fps = 0;
        let activeMediaElement = null, animationFrameId = null, cameraStream = null, lastResults = null;
        let mediaRecorder = null, recordedChunks = [];
        let isTorchOn = false, currentUploadedBlobUrl = null;
        let isTripwireBreached = false, lastAlarmSoundTime = 0;

        // ============================================================
        // SECTION 3: AI Models & Audio System
        // ============================================================
        let cocoModel = null, isCocoLoading = true;
        if (window.tf) {
            tf.ready().then(() => {
                if (window.cocoSsd) {
                    cocoSsd.load({ base: 'lite_mobilenet_v2' }).then(m => {
                        cocoModel = m; isCocoLoading = false;
                        const s = $id('statusText');
                        if (s && s.textContent === 'SYSTEM STANDBY') setElText('statusText', 'AI READY');
                    }).catch(e => { console.error('COCO-SSD error:', e); isCocoLoading = false; });
                }
            });
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let lastBeepTime = 0;

        function playBeep() {
            if (!config.audioBeep || audioCtx.state === 'suspended') return;
            const now = performance.now(); if (now - lastBeepTime < 100) return; lastBeepTime = now;
            try {
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.type = 'square'; o.frequency.setValueAtTime(880, audioCtx.currentTime);
                o.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.08);
                g.gain.setValueAtTime(0.04, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                o.connect(g); g.connect(audioCtx.destination);
                o.start(); o.stop(audioCtx.currentTime + 0.08);
            } catch (e) { }
        }

        function playAlarmSiren() {
            if (!config.tripwireSound || audioCtx.state === 'suspended') return;
            const now = performance.now(); if (now - lastAlarmSoundTime < 600) return; lastAlarmSoundTime = now;
            try {
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.type = 'sawtooth'; o.frequency.setValueAtTime(950, audioCtx.currentTime);
                o.frequency.linearRampToValueAtTime(380, audioCtx.currentTime + 0.35);
                g.gain.setValueAtTime(0.14, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                o.connect(g); g.connect(audioCtx.destination);
                o.start(); o.stop(audioCtx.currentTime + 0.35);
            } catch (e) { }
        }

        const config = {
            trackingMode: "face", isMirrored: true, audioBeep: true,
            lensFilter: "none", localFilter: "none", shapeType: "box",
            boundingSize: 0, motionRate: 0.25, blobMode: "size", blobValue: 64,
            outlineColor: "#00FFFF", blockColor: "#000000", trailColor: "#10B981", textColor: "#FFFFFF",
            thickness: 2, fontSize: 12,
            drawTrails: true, drawConnections: true, centerHub: false, lineStyle: "solid",
            showIds: true, showMetrics: true, showTelemetry: true, showWatermark: true, showScanlines: true,
            enableTripwire: false, tripwireSound: true, tripwirePos: 0.5, tripwireOrient: "horizontal"
        };

        function dist2D(a, b) { return Math.sqrt((b.x - a.x) ** 2 + (b.y - a.y) ** 2); }

        // ============================================================
        // SECTION 4: Shape Drawing & Telemetry HUD
        // ============================================================
        function drawShape(ctx, type, x, y, w, h, col, th, id, labelTxt, metricsTxt, targetObj) {
            ctx.save();
            ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = th;
            ctx.setLineDash([]); ctx.shadowBlur = 0;
            ctx.font = `bold ${config.fontSize}px Space Mono`;

            if (type === 'box') { ctx.strokeRect(x, y, w, h); }
            else if (type === 'solid') { ctx.fillStyle = config.blockColor; ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h); }
            else if (type === 'glow') { ctx.shadowBlur = 18; ctx.shadowColor = col; ctx.strokeRect(x, y, w, h); ctx.shadowBlur = 0; }
            else if (type === 'dash') { ctx.setLineDash([10, 8]); ctx.strokeRect(x, y, w, h); ctx.setLineDash([]); }
            else if (type === 'frame') { ctx.strokeRect(x, y, w, h); const p = Math.min(w, h) * 0.1; if (p > 2) ctx.strokeRect(x + p, y + p, w - p * 2, h - p * 2); }
            else if (type === 'xframe') {
                ctx.strokeRect(x, y, w, h);
                ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y + h); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x + w, y); ctx.lineTo(x, y + h); ctx.stroke();
            }
            else if (type === 'grid') {
                ctx.strokeRect(x, y, w, h); ctx.beginPath();
                ctx.moveTo(x + w / 3, y); ctx.lineTo(x + w / 3, y + h);
                ctx.moveTo(x + 2 * w / 3, y); ctx.lineTo(x + 2 * w / 3, y + h);
                ctx.moveTo(x, y + h / 3); ctx.lineTo(x + w, y + h / 3);
                ctx.moveTo(x, y + 2 * h / 3); ctx.lineTo(x + w, y + 2 * h / 3);
                ctx.stroke();
            }
            else if (type === 'scope') {
                const cx = x + w / 2, cy = y + h / 2, r = Math.min(w, h) / 2;
                ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx - r - 15, cy); ctx.lineTo(cx + r + 15, cy); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx, cy - r - 15); ctx.lineTo(cx, cy + r + 15); ctx.stroke();
                ctx.fillRect(cx - 2, cy - 2, 4, 4);
            }
            else if (type === 'brackets') {
                const bl = Math.min(w, h) * 0.2;
                ctx.beginPath(); ctx.moveTo(x, y + bl); ctx.lineTo(x, y); ctx.lineTo(x + bl, y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x + w - bl, y); ctx.lineTo(x + w); ctx.lineTo(x + w, y + bl); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x, y + h - bl); ctx.lineTo(x, y + h); ctx.lineTo(x + bl, y + h); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x + w - bl, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - bl); ctx.stroke();
            }
            else if (type === 'cross') {
                const cx = x + w / 2, cy = y + h / 2, sz = Math.min(w, h) * 0.4;
                ctx.beginPath(); ctx.moveTo(cx - sz, cy); ctx.lineTo(cx + sz, cy); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx, cy - sz); ctx.lineTo(cx, cy + sz); ctx.stroke();
            }
            else if (type === 'particle') {
                for (let i = 0; i < 15; i++) ctx.fillRect(x + Math.random() * w, y + Math.random() * h, th * 2, th * 2);
                ctx.strokeRect(x, y, w, h);
            }
            else if (type === 'label') {
                let title = labelTxt !== "WAJAH" ? labelTxt : (config.showIds ? `TGT-${id}` : "TARGET");
                ctx.font = `bold ${config.fontSize}px Arial`;
                const tw = ctx.measureText(title).width + 8;
                ctx.fillStyle = config.blockColor; ctx.fillRect(x, y, tw, config.fontSize + 8);
                ctx.fillStyle = config.textColor; ctx.fillText(title, x + 4, y + config.fontSize);
                ctx.restore(); return;
            }
            else if (type === 'win2k') {
                const hH = Math.max(16, config.fontSize + 6);
                const hY = y < hH ? y : y - hH;
                ctx.strokeRect(x, y, w, h);
                ctx.fillStyle = "#0000AA"; ctx.fillRect(x, hY, w, hH); ctx.strokeRect(x, hY, w, hH);
                let title = labelTxt !== "WAJAH" ? labelTxt : "Target";
                if (config.showIds) title = `ID:${id} ` + title;
                ctx.fillStyle = "#FFFFFF"; ctx.font = `${config.fontSize}px sans-serif`;
                ctx.fillText(title, x + 4, hY + hH - 4);
                ctx.fillStyle = "#C0C0C0"; ctx.fillRect(x + w - hH + 2, hY + 2, hH - 4, hH - 4);
                ctx.fillStyle = "#000"; ctx.fillText("x", x + w - hH + 4, hY + hH - 4);
                if (config.showMetrics) { ctx.fillStyle = config.textColor; ctx.font = `${config.fontSize}px Space Mono`; ctx.fillText(metricsTxt, x + w / 4, y + h / 2); }
            }
            else if (type === 'labelBox') {
                const hH = Math.max(16, config.fontSize + 6);
                const hY = y < hH ? y : y - hH;
                ctx.strokeRect(x, y, w, h);
                let title = labelTxt !== "WAJAH" ? labelTxt : "Object";
                if (config.showIds) title = `[ID:${id}] ` + title;
                ctx.font = `${config.fontSize}px Arial`;
                const tw = ctx.measureText(title).width + 8;
                ctx.fillStyle = "#FFFFFF"; ctx.fillRect(x, hY, tw, hH);
                ctx.fillStyle = "#000"; ctx.fillText(title, x + 4, hY + hH - 4);
                if (config.showMetrics) { ctx.fillStyle = config.textColor; ctx.fillText(metricsTxt, x + 4, y + h + config.fontSize); }
            }

            if (!['win2k', 'labelBox', 'label'].includes(type)) {
                ctx.fillStyle = config.textColor;
                ctx.font = `bold ${config.fontSize}px Space Mono`;
                let txtY = y > 15 ? y - 8 : y + config.fontSize + 4;

                let parts = [];
                if (config.showIds) parts.push(`[ID:${id}]`);
                if (labelTxt && (labelTxt !== "WAJAH" || !config.showIds)) parts.push(labelTxt);
                if (parts.length > 0) ctx.fillText(parts.join(" "), x, txtY);

                let lo = y + h + config.fontSize + 4;
                if (config.showMetrics) { ctx.fillText(`V:${metricsTxt}`, x, lo); lo += config.fontSize + 2; }

                if (config.showTelemetry && targetObj) {
                    const estDist = Math.max(0.4, (canvas.height / Math.max(1, h)) * 0.32).toFixed(1);
                    const pseudoTemp = (36.2 + ((id * 7) % 15) * 0.1).toFixed(1);
                    const vel = parseFloat(metricsTxt) || 0;
                    const threat = vel > 12 ? "HOSTILE" : (vel > 3 ? "CAUTION" : "PASSIVE");
                    const threatColor = threat === "HOSTILE" ? "#EF4444" : (threat === "CAUTION" ? "#F59E0B" : "#10B981");
                    ctx.fillStyle = threatColor;
                    ctx.fillText(`THR:[${threat}]`, x, lo); lo += config.fontSize + 2;
                    ctx.fillStyle = config.textColor;
                    ctx.font = `${Math.max(9, config.fontSize - 2)}px Space Mono`;
                    ctx.fillText(`DST:${estDist}m TMP:${pseudoTemp}C`, x, lo);
                }
            }
            ctx.restore();
        }

        // ============================================================
        // SECTION 5: Target Tracking & Motion
        // ============================================================
        function updateTrackedFaces(detections, cW, cH) {
            let current = [];
            detections.forEach(det => {
                let box = det.boundingBox, lbl = det.label || "WAJAH";
                let w = box.width * cW, h = box.height * cH;
                let cx = box.xCenter * cW, cy = box.yCenter * cH;
                if (config.boundingSize > 0) { w = config.boundingSize; h = config.boundingSize; }
                current.push({ x: cx - w / 2, y: cy - h / 2, w, h, cx, cy, area: w * h, label: lbl });
            });

            const threshold = Math.max(80, Math.min(cW, cH) * 0.2);
            const next = [];
            current.forEach(cf => {
                let best = null, minD = threshold;
                trackedFaces.forEach(tf => {
                    if (tf.claimed) return;
                    const d = dist2D({ x: cf.cx, y: cf.cy }, { x: tf.cx, y: tf.cy });
                    if (d < minD) { minD = d; best = tf; }
                });
                if (best) {
                    best.claimed = true; cf.id = best.id; cf.history = best.history || [];
                    cf.history.push({ x: cf.cx, y: cf.cy });
                    if (cf.history.length > 20) cf.history.shift();
                    cf.vx = cf.cx - best.cx; cf.vy = cf.cy - best.cy;
                    cf.label = best.label || cf.label;
                } else {
                    cf.id = nextFaceId++; cf.history = [{ x: cf.cx, y: cf.cy }];
                    cf.vx = 0; cf.vy = 0; playBeep();
                }
                next.push(cf);
            });
            trackedFaces = next;
        }

        const motionRes = 64;
        function getPixelClusters(vidElement, cW, cH, mode) {
            if (!window._pxCanvas) {
                window._pxCanvas = document.createElement('canvas');
                window._pxCanvas.width = motionRes; window._pxCanvas.height = motionRes;
                window._pxCtx = window._pxCanvas.getContext('2d', { willReadFrequently: true });
            }
            const pCtx = window._pxCtx;
            pCtx.drawImage(vidElement, 0, 0, motionRes, motionRes);
            const curr = pCtx.getImageData(0, 0, motionRes, motionRes).data;
            const sens = parseFloat(config.motionRate);
            const mThresh = 25 + (sens * 50), lThresh = 255 - (sens * 120);
            let blobs = []; const mergeDist = config.blobMode === 'size' ? Math.max(2, config.blobValue / 8) : 6;

            for (let i = 0; i < curr.length; i += 4) {
                let active = false;
                if (mode === 'motion' && window._lastPxData) {
                    const diff = Math.abs(curr[i] - window._lastPxData[i]) + Math.abs(curr[i + 1] - window._lastPxData[i + 1]) + Math.abs(curr[i + 2] - window._lastPxData[i + 2]);
                    if (diff > mThresh) active = true;
                } else if (mode === 'luma') {
                    const luma = curr[i] * 0.299 + curr[i + 1] * 0.587 + curr[i + 2] * 0.114;
                    if (luma > lThresh) active = true;
                }
                if (active) {
                    const px = (i / 4) % motionRes, py = Math.floor((i / 4) / motionRes);
                    let mb = null;
                    for (const b of blobs) { const dx = Math.max(b.minX - px, 0, px - b.maxX), dy = Math.max(b.minY - py, 0, py - b.maxY); if (dx <= mergeDist && dy <= mergeDist) { mb = b; break; } }
                    if (mb) { mb.sumX += px; mb.sumY += py; mb.count++; mb.minX = Math.min(mb.minX, px); mb.maxX = Math.max(mb.maxX, px); mb.minY = Math.min(mb.minY, py); mb.maxY = Math.max(mb.maxY, py); }
                    else blobs.push({ sumX: px, sumY: py, count: 1, minX: px, maxX: px, minY: py, maxY: py });
                }
            }
            window._lastPxData = new Uint8ClampedArray(curr);

            let valid = blobs.filter(b => b.count > 2).map(b => ({ cx: b.sumX / b.count, cy: b.sumY / b.count, w: Math.max(2, b.maxX - b.minX), h: Math.max(2, b.maxY - b.minY), area: (b.maxX - b.minX) * (b.maxY - b.minY) }));
            if (config.blobMode === 'count') { valid.sort((a, b) => b.area - a.area); valid = valid.slice(0, config.blobValue); }

            return valid.map(v => ({
                boundingBox: { xCenter: v.cx / motionRes, yCenter: v.cy / motionRes, width: v.w / motionRes, height: v.h / motionRes },
                label: mode === 'luma' ? "LUMA" : "MOTION"
            }));
        }

        const faceDetection = new FaceDetection({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${f}` });
        faceDetection.setOptions({ model: 'short', minDetectionConfidence: 0.5 });
        faceDetection.onResults(res => { if (isTracking && config.trackingMode === 'face') processResultsWrapper(res.image, res.detections || []); });

        const poseDetection = new Pose({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}` });
        poseDetection.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        poseDetection.onResults(res => {
            if (!isTracking || config.trackingMode !== 'pose') return;
            poseLandmarks = res.poseLandmarks || null;
            let mockDet = [];
            if (poseLandmarks && poseLandmarks.length > 0) {
                const xs = poseLandmarks.map(p => p.x), ys = poseLandmarks.map(p => p.y);
                const minX = Math.max(0, Math.min(...xs)), maxX = Math.min(1, Math.max(...xs));
                const minY = Math.max(0, Math.min(...ys)), maxY = Math.min(1, Math.max(...ys));
                mockDet.push({ boundingBox: { xCenter: (minX + maxX) / 2, yCenter: (minY + maxY) / 2, width: Math.max(0.1, maxX - minX), height: Math.max(0.1, maxY - minY) }, label: "POSE" });
            }
            processResultsWrapper(res.image, mockDet);
        });

        function processResultsWrapper(imageSrc, detectionsRaw) {
            if (!isTracking) return;
            lastResults = { image: imageSrc };
            if (config.trackingMode !== 'pose') poseLandmarks = null;
            if (!isStaticMedia) { const now = performance.now(); if (now - lastFrameTime > 0) fps = 1000 / (now - lastFrameTime); lastFrameTime = now; setElText('fpsDisplay', Math.round(fps)); }
            else setElText('fpsDisplay', 'STATIC');
            if (canvas) updateTrackedFaces(detectionsRaw, canvas.width, canvas.height);
            setElText('targetCount', trackedFaces.length);
            renderVisuals();
        }

        // ============================================================
        // SECTION 6: Loops & Static Media
        // ============================================================
        let lastMotionScanTime = 0, lastCocoScanTime = 0, isDetectingCoco = false;

        async function processStaticMedia() {
            if (!activeMediaElement || !isStaticMedia) return;
            setElText('statusText', 'ANALYZING...');
            if (config.trackingMode === 'face') { await faceDetection.send({ image: activeMediaElement }); }
            else if (config.trackingMode === 'pose') { await poseDetection.send({ image: activeMediaElement }); }
            else if (config.trackingMode === 'motion' || config.trackingMode === 'luma') {
                const md = getPixelClusters(activeMediaElement, canvas.width, canvas.height, config.trackingMode);
                processResultsWrapper(activeMediaElement, md);
            } else if (cocoModel) {
                const preds = await cocoModel.detect(activeMediaElement, 50, 0.25);
                const tC = config.trackingMode === 'person' ? ['person'] : config.trackingMode === 'animal' ? ['cat', 'dog', 'bird', 'horse', 'cow', 'sheep', 'bear', 'zebra', 'giraffe', 'elephant', 'teddy bear'] : ['potted plant'];
                const cw = activeMediaElement.width || activeMediaElement.videoWidth || 1;
                const ch = activeMediaElement.height || activeMediaElement.videoHeight || 1;
                const md = preds.filter(p => tC.includes(p.class.toLowerCase())).map(d => {
                    let fl = d.class.toUpperCase(); if (config.trackingMode === 'animal') fl = 'ANIMAL';
                    return { boundingBox: { xCenter: (d.bbox[0] + d.bbox[2] / 2) / cw, yCenter: (d.bbox[1] + d.bbox[3] / 2) / ch, width: d.bbox[2] / cw, height: d.bbox[3] / ch }, label: fl };
                });
                processResultsWrapper(activeMediaElement, md);
            } else if (isCocoLoading) { showMsg("MEMUAT AI", "Model AI sedang diunduh..."); }
            setElText('statusText', 'IMAGE READY');
        }

        async function runTrackerLoop() {
            if (!isTracking || !activeMediaElement || isStaticMedia) return;
            try {
                if (activeMediaElement.tagName === 'VIDEO' && activeMediaElement.readyState >= 2 && !activeMediaElement.paused) {
                    if (config.trackingMode === 'face') { await faceDetection.send({ image: activeMediaElement }); }
                    else if (config.trackingMode === 'pose') { await poseDetection.send({ image: activeMediaElement }); }
                    else if (config.trackingMode === 'motion' || config.trackingMode === 'luma') {
                        const now = performance.now();
                        if (now - lastMotionScanTime > 50) { lastMotionScanTime = now; const md = getPixelClusters(activeMediaElement, canvas.width, canvas.height, config.trackingMode); processResultsWrapper(activeMediaElement, md); }
                        else renderVisuals();
                    } else if (cocoModel) {
                        const now = performance.now();
                        if (now - lastCocoScanTime > 120 && !isDetectingCoco) {
                            isDetectingCoco = true; lastCocoScanTime = now;
                            const cw = activeMediaElement.videoWidth || activeMediaElement.width;
                            const ch = activeMediaElement.videoHeight || activeMediaElement.height;
                            if (cw && ch) {
                                cocoModel.detect(activeMediaElement, 50, 0.25).then(preds => {
                                    if (!isTracking) { isDetectingCoco = false; return; }
                                    const tC = config.trackingMode === 'person' ? ['person'] : config.trackingMode === 'animal' ? ['cat', 'dog', 'bird', 'horse', 'cow', 'sheep', 'bear', 'zebra', 'giraffe', 'elephant', 'teddy bear'] : ['potted plant'];
                                    const md = preds.filter(p => tC.includes(p.class.toLowerCase())).map(d => {
                                        let fl = d.class.toUpperCase(); if (config.trackingMode === 'animal') fl = 'ANIMAL';
                                        return { boundingBox: { xCenter: (d.bbox[0] + d.bbox[2] / 2) / cw, yCenter: (d.bbox[1] + d.bbox[3] / 2) / ch, width: d.bbox[2] / cw, height: d.bbox[3] / ch }, label: fl };
                                    });
                                    processResultsWrapper(activeMediaElement, md); isDetectingCoco = false;
                                }).catch(() => { isDetectingCoco = false; });
                            } else isDetectingCoco = false;
                        } else renderVisuals();
                    }
                }
            } catch (err) { console.error(err); }
            if (isTracking && !isStaticMedia) { if (animationFrameId) cancelAnimationFrame(animationFrameId); animationFrameId = requestAnimationFrame(runTrackerLoop); }
        }

        function drawConnectLine(ctx, x1, y1, x2, y2, style) {
            ctx.beginPath(); ctx.moveTo(x1, y1);
            if (style === 'dashed') { ctx.setLineDash([10, 10]); ctx.lineTo(x2, y2); }
            else if (style === 'curve') { ctx.setLineDash([]); ctx.quadraticCurveTo((x1 + x2) / 2, y1, x2, y2); }
            else if (style === 'step') { ctx.setLineDash([]); ctx.lineTo(x2, y1); ctx.lineTo(x2, y2); }
            else { ctx.setLineDash([]); ctx.lineTo(x2, y2); }
            ctx.stroke(); ctx.setLineDash([]);
        }

        // ============================================================
        // SECTION 7: WebGL Dual-Layer Compositing Pipeline
        // ============================================================
        function renderVisuals() {
            if (!isTracking || !lastResults || !ctx) return;
            const W = canvas.width, H = canvas.height;
            if (W <= 0 || H <= 0) return;

            // LAYER 1: Salin frame video asli yang bersih (cleanCanvas)
            cleanCanvas.width = W; cleanCanvas.height = H;
            cleanCtx.save();
            if (config.isMirrored) { cleanCtx.translate(W, 0); cleanCtx.scale(-1, 1); }
            cleanCtx.drawImage(lastResults.image, 0, 0, W, H);
            cleanCtx.restore();

            // LAYER 2: Terapkan Global Filter via GPU Shader WebGL
            ctx.clearRect(0, 0, W, H);
            if (config.lensFilter === 'none') {
                ctx.drawImage(cleanCanvas, 0, 0);
            } else {
                GPU.render(config.lensFilter, cleanCanvas, ctx, 0, 0, W, H);
            }

            // LAYER 3: Terapkan Local Filter di dalam kotak bounding box
            const getDrawX = (x, bw) => config.isMirrored ? W - x - bw : x;
            const getDrawCX = (cx) => config.isMirrored ? W - cx : cx;

            isTripwireBreached = false;
            const tripCoord = config.tripwireOrient === 'horizontal' ? H * config.tripwirePos : W * config.tripwirePos;

            if (trackedFaces.length > 0) {
                trackedFaces.forEach(f => {
                    const rx = Math.floor(getDrawX(f.x, f.w)), ry = Math.floor(f.y), rw = Math.floor(f.w), rh = Math.floor(f.h);
                    const cx1 = Math.max(0, rx), cy1 = Math.max(0, ry);
                    const cx2 = Math.min(W, rx + rw), cy2 = Math.min(H, ry + rh);
                    const crw = cx2 - cx1, crh = cy2 - cy1;

                    if (config.enableTripwire) {
                        if (config.tripwireOrient === 'horizontal' && ry <= tripCoord && (ry + rh) >= tripCoord) isTripwireBreached = true;
                        if (config.tripwireOrient === 'vertical' && rx <= tripCoord && (rx + rw) >= tripCoord) isTripwireBreached = true;
                    }

                    if (crw > 0 && crh > 0) {
                        if (config.localFilter === 'none') {
                            if (config.lensFilter !== 'none') ctx.drawImage(cleanCanvas, cx1, cy1, crw, crh, cx1, cy1, crw, crh);
                        } else {
                            GPU.renderCrop(config.localFilter, cleanCanvas, ctx, cx1, cy1, crw, crh, cx1, cy1);
                        }
                    }
                });
            }

            // LAYER 4: Tripwire Security Overlay
            if (config.enableTripwire) {
                ctx.save();
                ctx.lineWidth = isTripwireBreached ? 3 : 1.5;
                ctx.strokeStyle = isTripwireBreached ? "#EF4444" : "#F59E0B";
                ctx.setLineDash([8, 6]);
                ctx.beginPath();
                if (config.tripwireOrient === 'horizontal') { ctx.moveTo(0, tripCoord); ctx.lineTo(W, tripCoord); }
                else { ctx.moveTo(tripCoord, 0); ctx.lineTo(tripCoord, H); }
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = isTripwireBreached ? "#EF4444" : "#F59E0B";
                ctx.font = "bold 9px Space Mono";
                const twLabel = isTripwireBreached ? "[!] TRIPWIRE: BREACHED" : "TRIPWIRE: ACTIVE";
                if (config.tripwireOrient === 'horizontal') ctx.fillText(twLabel, 16, Math.max(16, tripCoord - 6));
                else ctx.fillText(twLabel, Math.max(4, tripCoord + 4), 24);
                ctx.restore();

                if (isTripwireBreached) {
                    playAlarmSiren();
                    ctx.fillStyle = "rgba(239,68,68,0.16)"; ctx.fillRect(0, 0, W, H);
                    const st = $id('statusText'); if (st) { st.textContent = "[!] INTRUSION DETECTED"; st.style.color = "#EF4444"; }
                } else {
                    const st = $id('statusText'); if (st && isTracking && st.textContent === "[!] INTRUSION DETECTED") { st.textContent = "TRACKING ACTIVE"; st.style.color = "#10B981"; }
                }
            }

            // LAYER 5: Vector Overlay (Jejak, Jaring, Kerangka, Kotak Target)
            ctx.strokeStyle = config.trailColor; ctx.lineWidth = config.thickness;

            if (config.drawConnections && trackedFaces.length > 1) {
                if (!config.centerHub) {
                    for (let i = 0; i < trackedFaces.length; i++) for (let j = i + 1; j < trackedFaces.length; j++)
                        drawConnectLine(ctx, getDrawCX(trackedFaces[i].cx), trackedFaces[i].cy, getDrawCX(trackedFaces[j].cx), trackedFaces[j].cy, config.lineStyle);
                } else {
                    for (let i = 1; i < trackedFaces.length; i++)
                        drawConnectLine(ctx, getDrawCX(trackedFaces[0].cx), trackedFaces[0].cy, getDrawCX(trackedFaces[i].cx), trackedFaces[i].cy, config.lineStyle);
                }
            }

            if (config.drawTrails) {
                ctx.setLineDash([]);
                trackedFaces.forEach(f => {
                    if (f.history && f.history.length > 1) {
                        ctx.beginPath(); ctx.moveTo(getDrawCX(f.history[0].x), f.history[0].y);
                        for (let i = 1; i < f.history.length; i++) ctx.lineTo(getDrawCX(f.history[i].x), f.history[i].y);
                        ctx.stroke();
                    }
                });
            }

            if (poseLandmarks && config.trackingMode === 'pose') {
                ctx.strokeStyle = config.outlineColor; ctx.fillStyle = config.outlineColor; ctx.lineWidth = config.thickness;
                const skeleton = [[11, 12], [11, 13], [13, 15], [15, 17], [15, 19], [15, 21], [12, 14], [14, 16], [16, 18], [16, 20], [16, 22], [11, 23], [12, 24], [23, 24], [23, 25], [25, 27], [27, 29], [27, 31], [29, 31], [24, 26], [26, 28], [28, 30], [28, 32], [30, 32], [0, 1], [1, 2], [2, 3], [3, 7], [0, 4], [4, 5], [5, 6], [6, 8], [9, 10]];
                skeleton.forEach(p => { const p1 = poseLandmarks[p[0]], p2 = poseLandmarks[p[1]]; if (p1 && p2 && (p1.visibility ?? 1) > 0.4 && (p2.visibility ?? 1) > 0.4) drawConnectLine(ctx, getDrawCX(p1.x * W), p1.y * H, getDrawCX(p2.x * W), p2.y * H, config.lineStyle); });
                ctx.setLineDash([]);
                poseLandmarks.forEach((lm, idx) => {
                    if ((lm.visibility ?? 1) > 0.4) {
                        const nx = getDrawCX(lm.x * W), ny = lm.y * H;
                        if (config.shapeType === 'glow') { ctx.shadowBlur = 15; ctx.shadowColor = config.outlineColor; ctx.beginPath(); ctx.arc(nx, ny, config.thickness * 2, 0, 2 * Math.PI); ctx.fill(); ctx.shadowBlur = 0; }
                        else ctx.strokeRect(nx - config.thickness, ny - config.thickness, config.thickness * 2, config.thickness * 2);
                        if (config.showIds && [0, 15, 16, 27, 28].includes(idx)) { ctx.fillStyle = config.textColor; ctx.font = `${config.fontSize}px Space Mono`; ctx.fillText(`J-${idx}`, nx + 8, ny - 8); ctx.fillStyle = config.outlineColor; }
                    }
                });
            }

            trackedFaces.forEach(f => {
                const dx = getDrawX(f.x, f.w);
                const vel = Math.sqrt((f.vx || 0) ** 2 + (f.vy || 0) ** 2).toFixed(2);
                drawShape(ctx, config.shapeType, dx, f.y, f.w, f.h, config.outlineColor, config.thickness, f.id, f.label, vel, f);
            });

            // LAYER 6: CCTV Watermark & Timecode
            if (config.showWatermark) {
                ctx.save();
                const now = new Date();
                const ts = now.toISOString().replace("T", " ").replace("Z", "");
                const blink = Math.floor(now.getTime() / 500) % 2 === 0;
                ctx.font = "bold 10px Space Mono";
                ctx.fillStyle = blink ? "#EF4444" : "rgba(239,68,68,0.2)"; ctx.fillText("REC ●", W - 72, 22);
                ctx.fillStyle = "#FFFFFF"; ctx.fillText("CAM-01 [ENC]", W - 175, 22);
                ctx.font = "9px Space Mono"; ctx.fillStyle = "rgba(255,255,255,0.7)";
                ctx.fillText(ts, W - 208, 38);
                ctx.fillText("RIDDLEBUSH // SEC_SYS v3.1 [GPU]", 16, H - 14);
                ctx.restore();
            }
        }

        // ============================================================
        // SECTION 8: Camera Lifecycle Management
        // ============================================================
        function stopSystem() {
            isTracking = false; isStaticMedia = false;
            if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
            if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') {
                try { mediaRecorder.stop(); } catch (e) { }
                isRecording = false;
                const rb = $id('recordVideoBtn');
                if (rb) { rb.textContent = "REKAM KAMERA"; rb.style.borderColor = "#EF4444"; rb.style.color = "#EF4444"; }
            }
            if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
            if (video) { video.pause(); video.srcObject = null; video.src = ""; video.onloadedmetadata = null; }
            if (currentUploadedBlobUrl) { URL.revokeObjectURL(currentUploadedBlobUrl); currentUploadedBlobUrl = null; }
            activeMediaElement = null; lastResults = null; window._lastPxData = null; poseLandmarks = null;
            if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height);
            trackedFaces = []; nextFaceId = 1;
            const st = $id('statusText'); if (st) { st.textContent = "SYSTEM STANDBY"; st.style.color = "#10B981"; }
            setElText('targetCount', '0'); setElText('fpsDisplay', '0');
            setElDisplay('stopBtn', 'none'); setElDisplay('cameraBtn', 'block');
            setElDisplay('torchBtn', 'none'); setElDisplay('playPauseBtn', 'none'); setElDisplay('autoRenderBtn', 'none');
            isTorchOn = false;
        }

        async function toggleTorch() {
            if (!cameraStream) return;
            const track = cameraStream.getVideoTracks()[0]; if (!track) return;
            const caps = track.getCapabilities ? track.getCapabilities() : {};
            if (caps.torch) {
                isTorchOn = !isTorchOn;
                try {
                    await track.applyConstraints({ advanced: [{ torch: isTorchOn }] });
                    const tb = $id('torchBtn'); if (tb) { tb.textContent = isTorchOn ? "MATIKAN SENTER" : "SENTER"; tb.style.backgroundColor = isTorchOn ? "#00FFFF" : "transparent"; tb.style.color = isTorchOn ? "#000" : "#00FFFF"; }
                } catch (e) { }
            } else showMsg("TIDAK DIDUKUNG", "Kamera tidak mendukung fitur senter.");
        }

        async function getDevices() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const vids = devices.filter(d => d.kind === 'videoinput');
                const sel = $id('cameraSelect');
                if (sel && vids.length > 0 && vids[0].label !== "") {
                    const cv = sel.value; sel.innerHTML = '';
                    [["user", "Kamera Depan (Default)"], ["environment", "Kamera Belakang (Default)"]].forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.text = t; sel.appendChild(o); });
                    vids.forEach((d, i) => { const o = document.createElement('option'); o.value = d.deviceId; o.text = d.label || `Lensa Kamera ${i + 1}`; sel.appendChild(o); });
                    sel.value = cv;
                }
            } catch (e) { }
        }

        async function startCamera() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const sel = $id('cameraSelect');
            const dev = sel ? sel.value : "user";
            stopSystem(); setElText('statusText', 'CONNECTING...');
            let vc = { width: { ideal: 1280 }, height: { ideal: 720 } };
            if (dev === 'user' || dev === 'environment') vc.facingMode = dev; else vc.deviceId = { exact: dev };
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: vc, audio: false });
                const track = cameraStream.getVideoTracks()[0];
                const label = track ? track.label.toLowerCase() : "";
                const mChk = $id('isMirrored');
                if (dev === 'user' || label.includes('front') || label.includes('depan')) { config.isMirrored = true; if (mChk) mChk.checked = true; }
                else { config.isMirrored = false; if (mChk) mChk.checked = false; }
                if (track && track.getCapabilities && track.getCapabilities().torch) setElDisplay('torchBtn', 'block');
                if (video) {
                    video.srcObject = cameraStream; video.muted = true;
                    video.onloadedmetadata = () => {
                        if (canvas) { canvas.width = video.videoWidth; canvas.height = video.videoHeight; }
                        video.play().then(() => {
                            activeMediaElement = video; isTracking = true;
                            setElText('statusText', 'TRACKING ACTIVE'); const st = $id('statusText'); if (st) st.style.color = '#10B981';
                            setElDisplay('cameraBtn', 'none'); setElDisplay('stopBtn', 'block');
                            setElDisplay('playPauseBtn', 'none'); setElDisplay('autoRenderBtn', 'none');
                            getDevices();
                            if (animationFrameId) cancelAnimationFrame(animationFrameId);
                            runTrackerLoop();
                        }).catch(e => console.error(e));
                    };
                }
            } catch (err) {
                console.error(err);
                showMsg("GAGAL BUKA KAMERA", "Pastikan memberikan izin akses kamera.");
                setElText('statusText', 'SYSTEM STANDBY');
            }
        }

        // ============================================================
        // SECTION 9: Event Handlers & Theme Switcher
        // ============================================================
        const btnCam = $id('cameraBtn'); if (btnCam) btnCam.addEventListener('click', startCamera);
        const btnStop = $id('stopBtn'); if (btnStop) btnStop.addEventListener('click', stopSystem);
        const btnTorch = $id('torchBtn'); if (btnTorch) btnTorch.addEventListener('click', toggleTorch);
        const selCam = $id('cameraSelect'); if (selCam) selCam.addEventListener('change', () => { if (isTracking && !isStaticMedia) startCamera(); });

        // HUD Mode
        function toggleHud() { document.body.classList.toggle('hud-mode'); }
        const btnHud = $id('btnToggleHud'); if (btnHud) btnHud.addEventListener('click', toggleHud);
        const hudExit = $id('hudExitBtn'); if (hudExit) hudExit.addEventListener('click', toggleHud);
        if (canvas) canvas.addEventListener('dblclick', toggleHud);
        window.addEventListener('keydown', e => { if (e.key === 'h' || e.key === 'H') toggleHud(); if (e.key === 'Escape' && document.body.classList.contains('hud-mode')) toggleHud(); });

        // Play/Pause Uploaded Video
        const btnPP = $id('playPauseBtn');
        if (btnPP) btnPP.addEventListener('click', () => {
            if (activeMediaElement && activeMediaElement.tagName === 'VIDEO') {
                if (activeMediaElement.paused) { activeMediaElement.play().then(() => { setElText('statusText', 'VIDEO PREVIEW (PLAYING)'); if (animationFrameId) cancelAnimationFrame(animationFrameId); runTrackerLoop(); }); }
                else { activeMediaElement.pause(); setElText('statusText', 'VIDEO PREVIEW (PAUSED)'); }
            }
        });

        // Theme Presets
        const THEMES = {
            cyberpunk: { outline: "#00FFFF", block: "#000000", trail: "#F59E0B", text: "#00FFFF", lens: "none", local: "none", shape: "brackets" },
            matrix: { outline: "#00FF66", block: "#051A0A", trail: "#00FF66", text: "#80FF80", lens: "none", local: "none", shape: "grid" },
            military: { outline: "#10B981", block: "#001A00", trail: "#EF4444", text: "#10B981", lens: "nightvision", local: "thermal", shape: "scope" },
            synthwave: { outline: "#FF007F", block: "#1A0022", trail: "#00F0FF", text: "#FFE600", lens: "crt", local: "glitch", shape: "win2k" },
            stealth: { outline: "#888888", block: "#000000", trail: "#444444", text: "#FFFFFF", lens: "mask", local: "pixelate", shape: "solid" }
        };
        const tSel = $id('themePreset');
        if (tSel) tSel.addEventListener('change', e => {
            const pr = THEMES[e.target.value]; if (!pr) return;
            Object.assign(config, { outlineColor: pr.outline, blockColor: pr.block, trailColor: pr.trail, textColor: pr.text, lensFilter: pr.lens, localFilter: pr.local, shapeType: pr.shape });
            if ($id('outlineColor')) $id('outlineColor').value = pr.outline;
            if ($id('blockColor')) $id('blockColor').value = pr.block;
            if ($id('trailColor')) $id('trailColor').value = pr.trail;
            if ($id('textColor')) $id('textColor').value = pr.text;
            if ($id('lensFilter')) $id('lensFilter').value = pr.lens;
            if ($id('localFilter')) $id('localFilter').value = pr.local;
            if ($id('shapeType')) $id('shapeType').value = pr.shape;
            if (isTracking && isStaticMedia) renderVisuals();
        });

        // Binding Options
        [
            {
                id: "trackingMode", type: "value", cb: () => {
                    const isBlobMode = config.trackingMode === 'motion' || config.trackingMode === 'luma';
                    setElDisplay('motionRateContainer', isBlobMode ? 'block' : 'none');
                    setElDisplay('blobControlContainer', isBlobMode ? 'block' : 'none');
                    window._lastPxData = null;
                    if (isStaticMedia) processStaticMedia();
                }
            },
            { id: "isMirrored", type: "checked" }, { id: "centerHub", type: "checked" },
            { id: "lensFilter", type: "value" }, { id: "localFilter", type: "value" },
            { id: "shapeType", type: "value" },
            { id: "outlineColor", type: "value" }, { id: "blockColor", type: "value" }, { id: "trailColor", type: "value" }, { id: "textColor", type: "value" },
            { id: "drawConnections", type: "checked" }, { id: "drawTrails", type: "checked" }, { id: "audioBeep", type: "checked" },
            { id: "showIds", type: "checked" }, { id: "showMetrics", type: "checked" }, { id: "showTelemetry", type: "checked" }, { id: "showWatermark", type: "checked" },
            { id: "enableTripwire", type: "checked" }, { id: "tripwireSound", type: "checked" },
            { id: "showScanlines", type: "checked", cb: () => { const cc = $id('canvas-container'); if (cc) cc.classList.toggle('scanlines-active', config.showScanlines); } }
        ].forEach(b => {
            const el = $id(b.id); if (!el) return;
            el.addEventListener('change', e => {
                if (b.type === 'value') config[b.id] = e.target.value;
                else config[b.id] = e.target.checked;
                if (b.cb) b.cb();
                if (isTracking && isStaticMedia) renderVisuals();
            });
        });

        const twPosEl = $id('tripwirePos');
        if (twPosEl) twPosEl.addEventListener('input', e => { config.tripwirePos = parseInt(e.target.value) / 100; setElText('tripwirePosVal', e.target.value + '%'); if (isTracking && isStaticMedia) renderVisuals(); });
        document.querySelectorAll('input[name="tripwireOrient"]').forEach(el => el.addEventListener('change', e => { config.tripwireOrient = e.target.value; if (isTracking && isStaticMedia) renderVisuals(); }));

        [{ name: "mrate", cfg: "motionRate", float: true }, { name: "blobVal", cfg: "blobValue", float: false }, { name: "bsize", cfg: "boundingSize", float: false }, { name: "lineStyle", cfg: "lineStyle", float: false }].forEach(sb => {
            document.querySelectorAll(`input[name="${sb.name}"]`).forEach(el => el.addEventListener('change', e => {
                const val = e.target.value;
                config[sb.cfg] = sb.float ? parseFloat(val) : (isNaN(val) ? val : parseInt(val));
                if (sb.name === 'mrate') setElText('mrateLabel', val);
                if (isTracking && isStaticMedia) { if (sb.name.includes('blob') || sb.name === 'mrate') processStaticMedia(); else renderVisuals(); }
            }));
        });

        document.querySelectorAll('input[name="blobMode"]').forEach(el => el.addEventListener('change', e => {
            config.blobMode = e.target.value;
            const sV = [16, 32, 64, 128, 256, 512], cV = [1, 2, 4, 8, 16, 32];
            const vals = config.blobMode === 'size' ? sV : cV;
            for (let i = 1; i <= 6; i++) { const inp = $id('bv' + i), lbl = $id('lbl_bv' + i); if (inp && lbl) { inp.value = vals[i - 1]; lbl.textContent = vals[i - 1]; } }
            const av = document.querySelector('input[name="blobVal"]:checked'); if (av) config.blobValue = parseInt(av.value);
            if (isTracking && isStaticMedia) processStaticMedia();
        }));

        const thEl = $id('thickness');
        if (thEl) thEl.addEventListener('input', e => { config.thickness = parseInt(e.target.value); setElText('thicknessVal', config.thickness + 'px'); if (isTracking && isStaticMedia) renderVisuals(); });
        const fsEl = $id('fontSize');
        if (fsEl) fsEl.addEventListener('input', e => { config.fontSize = parseInt(e.target.value); setElText('fontSizeVal', config.fontSize + 'px'); if (isTracking && isStaticMedia) renderVisuals(); });

        // ============================================================
        // SECTION 10: File Upload Handler
        // ============================================================
        const mediaUploadEl = $id('mediaUpload');
        if (mediaUploadEl) mediaUploadEl.addEventListener('change', async e => {
            const file = e.target.files[0]; if (!file) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            stopSystem();
            setElDisplay('cameraBtn', 'none'); setElDisplay('stopBtn', 'block'); setElText('statusText', 'LOADING...');
            currentUploadedBlobUrl = URL.createObjectURL(file);

            if (file.type.startsWith('image/')) {
                const img = new Image();
                img.onload = async () => {
                    if (canvas) { canvas.width = img.naturalWidth; canvas.height = img.naturalHeight; }
                    activeMediaElement = document.createElement('canvas');
                    activeMediaElement.width = img.naturalWidth; activeMediaElement.height = img.naturalHeight;
                    activeMediaElement.getContext('2d').drawImage(img, 0, 0);
                    isStaticMedia = true; isTracking = true;
                    setElDisplay('autoRenderBtn', 'block'); setElText('autoRenderBtn', 'SIMPAN FOTO (HASIL)');
                    setElDisplay('playPauseBtn', 'none');
                    await processStaticMedia();
                };
                img.src = currentUploadedBlobUrl;
            } else if (file.type.startsWith('video/')) {
                if (video) {
                    video.src = currentUploadedBlobUrl; video.loop = true; video.muted = true;
                    video.onloadedmetadata = () => {
                        if (canvas) { canvas.width = video.videoWidth; canvas.height = video.videoHeight; }
                        activeMediaElement = video; isStaticMedia = false; isTracking = true;
                        setElDisplay('autoRenderBtn', 'block'); setElText('autoRenderBtn', 'RENDER & SIMPAN');
                        setElDisplay('playPauseBtn', 'block');
                        video.play().then(() => {
                            setElText('statusText', 'VIDEO PREVIEW (PLAYING)');
                            if (animationFrameId) cancelAnimationFrame(animationFrameId);
                            runTrackerLoop();
                        }).catch(err => { console.warn('Autoplay blocked:', err); setElText('statusText', 'KLIK PLAY UNTUK MULAI'); });
                    };
                }
            }
        });

        // ============================================================
        // SECTION 11: Export & Recording Engine
        // ============================================================
        function makeMediaRecorder(stream, format) {
            try { return new MediaRecorder(stream, { mimeType: format }); }
            catch (e) { return new MediaRecorder(stream); }
        }
        function downloadBlob(blob, ext) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `VFX_${Date.now()}.${ext}`; a.click();
            setTimeout(() => URL.revokeObjectURL(url), 2000);
        }

        const btnAutoRender = $id('autoRenderBtn');
        if (btnAutoRender) btnAutoRender.addEventListener('click', () => {
            if (!activeMediaElement) return;
            if (isStaticMedia && canvas) {
                const a = document.createElement('a'); a.download = `VFX_Export_${Date.now()}.png`; a.href = canvas.toDataURL("image/png"); a.click();
                showMsg("SELESAI", "Foto berhasil disimpan.");
            } else if (!isStaticMedia && activeMediaElement.tagName === 'VIDEO' && canvas) {
                activeMediaElement.loop = false; activeMediaElement.currentTime = 0; recordedChunks = [];
                const stream = new MediaStream(canvas.captureStream(30).getVideoTracks());
                try { const as = activeMediaElement.captureStream ? activeMediaElement.captureStream() : null; if (as && as.getAudioTracks().length > 0) stream.addTrack(as.getAudioTracks()[0]); } catch (e) { }
                const vfEl = $id('videoFormat'); let fmt = vfEl ? vfEl.value : "video/webm";
                if (fmt === "video/mp4" && !MediaRecorder.isTypeSupported("video/mp4")) fmt = "video/webm";
                mediaRecorder = makeMediaRecorder(stream, fmt);
                mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const ext = fmt.includes("mp4") ? "mp4" : "webm";
                    downloadBlob(new Blob(recordedChunks, { type: fmt }), ext);
                    showMsg("SELESAI", "Video berhasil dirender!"); activeMediaElement.loop = true; activeMediaElement.play();
                    btnAutoRender.textContent = "RENDER & SIMPAN"; btnAutoRender.style.color = "#8B5CF6"; btnAutoRender.disabled = false;
                };
                activeMediaElement.onended = () => { if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop(); };
                mediaRecorder.start(); activeMediaElement.play();
                btnAutoRender.textContent = "RENDERING..."; btnAutoRender.style.color = "#EF4444"; btnAutoRender.disabled = true;
            }
        });

        const btnSave = $id('saveImgBtn');
        if (btnSave && canvas) btnSave.addEventListener('click', () => { const a = document.createElement('a'); a.download = `VFX_Snapshot_${Date.now()}.png`; a.href = canvas.toDataURL("image/png"); a.click(); });

        const btnRec = $id('recordVideoBtn');
        if (btnRec && canvas) btnRec.addEventListener('click', () => {
            if (isRecording) {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                isRecording = false; btnRec.textContent = "REKAM KAMERA"; btnRec.style.borderColor = "#EF4444"; btnRec.style.color = "#EF4444";
            } else {
                if (!isTracking) return showMsg("PERHATIAN", "Mulai kamera terlebih dahulu!");
                recordedChunks = [];
                const stream = new MediaStream(canvas.captureStream(30).getVideoTracks());
                if (cameraStream && cameraStream.getAudioTracks().length > 0) stream.addTrack(cameraStream.getAudioTracks()[0]);
                const vfEl = $id('videoFormat'); let fmt = vfEl ? vfEl.value : "video/webm";
                if (fmt === "video/mp4" && !MediaRecorder.isTypeSupported("video/mp4")) { fmt = "video/webm"; showMsg("INFO", "Beralih ke WebM."); }
                mediaRecorder = makeMediaRecorder(stream, fmt);
                mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => { const ext = fmt.includes("mp4") ? "mp4" : "webm"; downloadBlob(new Blob(recordedChunks, { type: fmt }), ext); };
                mediaRecorder.start(); isRecording = true;
                btnRec.textContent = "STOP REKAM"; btnRec.style.borderColor = "#00FFFF"; btnRec.style.color = "#00FFFF";
            }
        });

        window.addEventListener('resize', () => {
            if (activeMediaElement && activeMediaElement.tagName === 'VIDEO' && activeMediaElement.videoWidth && canvas) {
                canvas.width = activeMediaElement.videoWidth; canvas.height = activeMediaElement.videoHeight;
                if (isTracking) renderVisuals();
            }
        });
    </script>
</body>

</html>
