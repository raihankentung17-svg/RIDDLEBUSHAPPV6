<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">

    <title>RIDDLEBUSHARCHIVE | Tracker Pro</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">

    <!-- External AI Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd" crossorigin="anonymous"></script>

    <style>
        @import url("https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap");

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Space Mono", monospace;
            background: #050505;
            color: #e5e5e5;
            overflow: hidden;
            font-size: 11px;
            overscroll-behavior-y: contain;
        }

        #container {
            display: flex;
            height: 100vh;
            width: 100vw;
            flex-direction: row;
            position: relative;
        }

        #canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #050505;
            border-right: 1px solid #222;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        #videoCanvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #canvas-container.scanlines-active::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        #controls {
            width: 360px;
            background: #0a0a0a;
            padding: 16px;
            overflow-y: auto;
            border-left: 1px solid #222;
            z-index: 20;
            transition: transform 0.3s ease, width 0.3s ease;
        }

        /* Fullscreen HUD Mode */
        body.hud-mode #controls {
            display: none !important;
        }

        body.hud-mode #canvas-container {
            width: 100vw;
            height: 100vh;
            border-right: none;
        }

        #hudExitBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(10, 10, 10, 0.85);
            color: #00FFFF;
            border: 1px solid #00FFFF;
            padding: 8px 16px;
            border-radius: 6px;
            font-family: "Space Mono", monospace;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            z-index: 30;
            display: none;
            backdrop-filter: blur(8px);
        }

        body.hud-mode #hudExitBtn {
            display: block;
        }

        @media (max-width: 768px) {
            #container {
                flex-direction: column;
            }

            #canvas-container {
                flex: none;
                height: 50vh;
                border-right: none;
                border-bottom: 1px solid #222;
            }

            #controls {
                width: 100%;
                flex: 1;
                border-left: none;
                padding-bottom: 40px;
                padding: 12px;
            }

            #status {
                transform: scale(0.85);
                transform-origin: top left;
            }
        }

        .section-box {
            background: #111;
            border: 1px solid #222;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .section-box h3 {
            font-size: 11px;
            margin-bottom: 14px;
            text-transform: uppercase;
            font-weight: 700;
            color: #888;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 1px;
        }

        .pro-badge {
            background: rgba(245, 158, 11, 0.15);
            color: #F59E0B;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: bold;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .new-badge {
            background: rgba(0, 255, 255, 0.15);
            color: #00FFFF;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: bold;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .alarm-badge {
            background: rgba(239, 68, 68, 0.2);
            color: #EF4444;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: bold;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 10px;
            color: #aaa;
            font-weight: bold;
        }

        .inline-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        input[type="range"] {
            width: 100%;
            margin-bottom: 8px;
            height: 4px;
            background: #222;
            outline: none;
            -webkit-appearance: none;
            border-radius: 4px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #00FFFF;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }

        input[type="range"]:active::-webkit-slider-thumb {
            background: #10B981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.8);
        }

        input[type="checkbox"] {
            margin-right: 8px;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border: 1px solid #444;
            background: #111;
            cursor: pointer;
            position: relative;
            border-radius: 4px;
            transition: 0.2s;
        }

        input[type="checkbox"]:checked {
            background: #10B981;
            border-color: #10B981;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 10px;
            color: #ccc;
            margin-bottom: 0;
            font-weight: normal;
        }

        .checkbox-label:hover {
            color: #fff;
        }

        select {
            width: 100%;
            padding: 10px;
            background: #111;
            color: #fff;
            border: 1px solid #333;
            margin-bottom: 12px;
            font-family: "Space Mono", monospace;
            font-size: 10px;
            outline: none;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }

        select:focus {
            border-color: #10B981;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #222;
            color: #ccc;
            border: 1px solid #333;
            cursor: pointer;
            font-family: "Space Mono", monospace;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 11px;
            transition: all 0.2s;
            border-radius: 6px;
            text-transform: uppercase;
        }

        button:hover {
            background: #333;
            color: #fff;
        }

        button:active {
            transform: scale(0.98);
        }

        button.primary {
            background: #10B981;
            color: #000;
            border: none;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        button.primary:hover {
            background: #059669;
            color: #000;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        button.danger {
            background: #EF4444;
            color: #000;
            border: none;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
        }

        button.danger:hover {
            background: #DC2626;
            color: #000;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }

        button.action {
            background: #00FFFF;
            color: #000;
            border: none;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        button.action:hover {
            background: #0891B2;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }

        button.magic {
            background: #8B5CF6;
            color: #000;
            border: none;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
        }

        button.magic:hover {
            background: #7C3AED;
            color: #000;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }

        .app-title-header {
            font-size: 14px;
            font-weight: 700;
            color: #10B981;
            margin-bottom: 16px;
            letter-spacing: 2px;
            text-align: center;
            padding: 12px;
            border: 1px solid #222;
            background: #111;
            border-radius: 8px;
        }

        .value-display {
            font-weight: 700;
            font-size: 10px;
            color: #00FFFF;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 10, 0.9);
            color: #00FFFF;
            padding: 10px 16px;
            border: 1px solid #222;
            font-size: 10px;
            z-index: 20;
            backdrop-filter: blur(8px);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hud-toggle-btn {
            background: #1a1a1a;
            color: #00FFFF;
            border: 1px solid #333;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 9px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: 0.2s;
        }

        .hud-toggle-btn:hover {
            background: #00FFFF;
            color: #000;
        }

        .color-picker {
            width: 100%;
            height: 32px;
            border: 1px solid #333;
            cursor: pointer;
            -webkit-appearance: none;
            padding: 0;
            background: #111;
            border-radius: 6px;
        }

        .segmented-control {
            display: flex;
            width: 100%;
            background: #111;
            border: 1px solid #333;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .segmented-control input[type="radio"] {
            display: none;
        }

        .segmented-control label {
            flex: 1;
            text-align: center;
            padding: 10px 4px;
            margin: 0;
            font-weight: bold;
            font-size: 10px;
            color: #888;
            cursor: pointer;
            border-right: 1px solid #333;
            transition: 0.2s;
            background: #1a1a1a;
            white-space: nowrap;
        }

        .segmented-control label:last-child {
            border-right: none;
        }

        .segmented-control label:hover {
            color: #fff;
            background: #222;
        }

        .segmented-control input[type="radio"]:checked+label {
            background: #222;
            color: #00FFFF;
            box-shadow: inset 0 -2px 0 #00FFFF;
        }

        .segmented-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 0;
            border: 1px solid #333;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .segmented-grid label {
            padding: 8px 0;
            border-right: 1px solid #333;
            background: #1a1a1a;
        }

        .segmented-grid label:last-child {
            border-right: none;
        }

        .tool-group {
            border: 1px solid #222;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 14px;
            background: #0a0a0a;
        }

        #controls::-webkit-scrollbar {
            width: 4px;
        }

        #controls::-webkit-scrollbar-track {
            background: transparent;
        }

        #controls::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        #webcam {
            display: none;
        }

        #msgBox {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid #10B981;
            padding: 24px;
            z-index: 100;
            display: none;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
            width: 80%;
            max-width: 320px;
            backdrop-filter: blur(10px);
        }

        #msgBox h4 {
            color: #10B981;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        #msgBox button {
            width: auto;
            padding: 10px 24px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="canvas-container" class="scanlines-active">
            <video id="webcam" playsinline muted></video>
            <canvas id="videoCanvas"></canvas>

            <div id="status">
                <div><span id="statusText" style="color:#10B981;">SYSTEM STANDBY</span> | FPS: <span
                        id="fpsDisplay">0</span> | TGT: <span id="targetCount">0</span></div>
                <button class="hud-toggle-btn" id="btnToggleHud" title="Atau tekan tombol 'H'">⛶ HUD</button>
            </div>

            <button id="hudExitBtn">✕ KELUAR HUD</button>

            <div id="msgBox">
                <h4 id="msgTitle">PEMBERITAHUAN</h4>
                <p id="msgDesc" style="color: #ccc; line-height: 1.5;">Deskripsi</p>
                <button class="primary" onclick="document.getElementById('msgBox').style.display='none'">TUTUP</button>
            </div>
        </div>

        <div id="controls">
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <a href="index.html" onmouseover="this.style.background='#333'; this.style.color='#fff'"
                    onmouseout="this.style.background='#222'; this.style.color='#ccc'"
                    style="background: #222; color: #ccc; text-decoration: none; padding: 12px 14px; border: 1px solid #333; border-radius: 8px; font-size: 11px; display: flex; align-items: center; transition: 0.2s; font-weight: bold;">←
                    HUB</a>
                <div class="app-title-header" style="margin-bottom: 0; flex: 1;">BLOB TRACKER PRO</div>
            </div>

            <!-- PRESET TEMA CEPAT -->
            <div class="section-box">
                <h3>Theme Presets <span class="new-badge">1-CLICK</span></h3>
                <label>Pilih Gaya Tampilan Instan</label>
                <select id="themePreset">
                    <option value="custom">Custom (Bebas)</option>
                    <option value="cyberpunk" selected>Cyberpunk 2077 (Cyan & Gold)</option>
                    <option value="matrix">The Matrix (Phosphor Green)</option>
                    <option value="military">Military Recon (Nightvision & Thermal)</option>
                    <option value="synthwave">Synthwave 80s (CRT & Magenta)</option>
                    <option value="stealth">Stealth Censor (Mask & Pixelate)</option>
                </select>
            </div>

            <div class="section-box">
                <h3>System Input <span class="new-badge">APP</span></h3>

                <select id="cameraSelect">
                    <option value="user">Kamera Depan (Default)</option>
                    <option value="environment">Kamera Belakang (Default)</option>
                </select>

                <div class="grid-3" style="margin-bottom: 12px;">
                    <label class="checkbox-label"><input type="checkbox" id="isMirrored"
                            checked /><span>Mirror</span></label>
                    <label class="checkbox-label"><input type="checkbox" id="audioBeep"
                            checked /><span>Beep</span></label>
                    <label class="checkbox-label"><input type="checkbox" id="showScanlines" checked /><span>Efek
                            CRT</span></label>
                </div>

                <div class="grid-2">
                    <button id="cameraBtn" class="primary">LIVE CAM</button>
                    <button id="stopBtn" class="danger" style="display: none;">STOP LIVE</button>
                    <div>
                        <label for="mediaUpload"
                            style="display:flex; justify-content:center; align-items:center; width:100%; height:40px; background:#222; color:#00FFFF; border:1px solid #333; cursor:pointer; font-weight:bold; border-radius:6px; font-size:11px; transition:0.2s;"
                            onmouseover="this.style.background='#333'" onmouseout="this.style.background='#222'">UNGGAH
                            FILE</label>
                        <input type="file" id="mediaUpload" accept="image/*,video/*" style="display: none;" />
                    </div>
                </div>

                <div class="grid-2">
                    <button id="playPauseBtn" class="action" style="display: none;">PAUSE / PLAY PREVIEW</button>
                    <button id="torchBtn" class="action" style="display: none;">SENTER</button>
                </div>
            </div>

            <!-- VIRTUAL TRIPWIRE (PERIMETER ALARM) -->
            <div class="section-box">
                <h3>CCTV Tripwire Alarm <span class="alarm-badge">SECURITY</span></h3>
                <div class="grid-2" style="margin-bottom: 10px;">
                    <label class="checkbox-label"><input type="checkbox" id="enableTripwire" /><span>Aktifkan
                            Tripwire</span></label>
                    <label class="checkbox-label"><input type="checkbox" id="tripwireSound" checked /><span>Sirine
                            Alarm</span></label>
                </div>
                <div class="tool-group" style="margin-bottom:0;">
                    <div class="inline-label">
                        <label style="margin:0;">Posisi Garis Batas</label>
                        <span class="value-display" id="tripwirePosVal">50%</span>
                    </div>
                    <input type="range" id="tripwirePos" min="10" max="90" value="50" style="margin-bottom:8px;" />
                    <div class="segmented-control" style="margin-bottom:0;">
                        <input type="radio" name="tripwireOrient" id="two_h" value="horizontal" checked><label
                            for="two_h">Horizontal</label>
                        <input type="radio" name="tripwireOrient" id="two_v" value="vertical"><label
                            for="two_v">Vertical</label>
                    </div>
                </div>
            </div>

            <div class="section-box">
                <h3>AI Tracking Mode <span class="pro-badge">AI</span></h3>
                <select id="trackingMode">
                    <option value="face">Wajah / Face (High FPS)</option>
                    <option value="person">Tubuh / Body (Person)</option>
                    <option value="animal">Mamalia / Burung (Animal)</option>
                    <option value="plant">Tanaman (Potted Plant)</option>
                    <option value="pose">Kerangka Tubuh (Pose Skeleton)</option>
                    <option value="motion">Semua Gerakan (Motion Blobs)</option>
                    <option value="luma">Cahaya Terang (Luma Blobs)</option>
                </select>

                <div id="motionRateContainer" class="tool-group" style="display:none;">
                    <div class="inline-label">
                        <label style="margin:0;">Sensitivitas Deteksi</label>
                        <span class="value-display" id="mrateLabel">0.25</span>
                    </div>
                    <div class="segmented-control" style="margin-bottom:0; margin-top:10px;">
                        <input type="radio" name="mrate" id="mr1" value="0.25" checked><label for="mr1">0.25</label>
                        <input type="radio" name="mrate" id="mr2" value="0.5"><label for="mr2">0.5</label>
                        <input type="radio" name="mrate" id="mr3" value="0.75"><label for="mr3">0.75</label>
                        <input type="radio" name="mrate" id="mr4" value="1.0"><label for="mr4">1</label>
                    </div>
                </div>

                <div id="blobControlContainer" class="tool-group" style="display:none;">
                    <div class="inline-label"><label style="margin:0; color:#10B981;">Blob Control</label></div>
                    <div class="segmented-control" style="margin-top:10px; margin-bottom: 10px;">
                        <input type="radio" name="blobMode" id="bm_size" value="size" checked><label for="bm_size">By
                            Size</label>
                        <input type="radio" name="blobMode" id="bm_count" value="count"><label for="bm_count">By
                            Count</label>
                    </div>
                    <div class="segmented-control segmented-grid" style="margin-bottom:0;">
                        <input type="radio" name="blobVal" id="bv1" value="16"><label for="bv1" id="lbl_bv1">16</label>
                        <input type="radio" name="blobVal" id="bv2" value="32"><label for="bv2" id="lbl_bv2">32</label>
                        <input type="radio" name="blobVal" id="bv3" value="64" checked><label for="bv3"
                            id="lbl_bv3">64</label>
                        <input type="radio" name="blobVal" id="bv4" value="128"><label for="bv4"
                            id="lbl_bv4">128</label>
                        <input type="radio" name="blobVal" id="bv5" value="256"><label for="bv5"
                            id="lbl_bv5">256</label>
                        <input type="radio" name="blobVal" id="bv6" value="512"><label for="bv6"
                            id="lbl_bv6">512</label>
                    </div>
                </div>
            </div>

            <div class="section-box">
                <h3>Region Style <span class="pro-badge">PRO</span></h3>

                <label>Gaya Bentuk Objek (Shape)</label>
                <select id="shapeType">
                    <option value="box">Basic (Frame Biasa)</option>
                    <option value="cross">Cross (Silang Target)</option>
                    <option value="label">Label (Teks Saja)</option>
                    <option value="frame">Frame (Bingkai Ganda)</option>
                    <option value="brackets">L-Frame (Sudut Kurung)</option>
                    <option value="xframe">X-Frame (Silang Penuh)</option>
                    <option value="grid">Grid (Jaring 3x3)</option>
                    <option value="particle">Particle (Partikel Acak)</option>
                    <option value="dash">Dash (Garis Putus)</option>
                    <option value="scope">Scope (Lensa Bidik)</option>
                    <option value="win2k">Win2K (Jendela Retro)</option>
                    <option value="labelBox">Label 2 (Teks Kotak)</option>
                    <option value="glow">Glow (Cahaya Neon)</option>
                    <option value="solid">Backdrop (Blok Solid)</option>
                </select>

                <div class="tool-group">
                    <div class="inline-label"><label style="margin:0;">Bounding Size</label></div>
                    <div class="segmented-control segmented-grid" style="margin-top:10px; margin-bottom:0;">
                        <input type="radio" name="bsize" id="bs0" value="0" checked><label for="bs0">Auto</label>
                        <input type="radio" name="bsize" id="bs32" value="32"><label for="bs32">32</label>
                        <input type="radio" name="bsize" id="bs64" value="64"><label for="bs64">64</label>
                        <input type="radio" name="bsize" id="bs128" value="128"><label for="bs128">128</label>
                        <input type="radio" name="bsize" id="bs256" value="256"><label for="bs256">256</label>
                        <input type="radio" name="bsize" id="bs512" value="512"><label for="bs512">512</label>
                    </div>
                </div>

                <div class="grid-2">
                    <div>
                        <label>Warna Garis</label>
                        <input type="color" id="outlineColor" value="#00FFFF" class="color-picker" />
                    </div>
                    <div>
                        <label>Warna Blok Censor</label>
                        <input type="color" id="blockColor" value="#000000" class="color-picker" />
                    </div>
