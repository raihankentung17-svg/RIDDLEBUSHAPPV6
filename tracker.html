    <script>
        // ==========================================
        // 1. UI HELPER & STATE
        // ==========================================
        function setElDisplay(id, val) {
            const el = document.getElementById(id);
            if (el) el.style.display = val;
        }

        function setElText(id, text) {
            const el = document.getElementById(id);
            if (el) el.textContent = text;
        }

        function showMsg(title, desc) {
            setElText('msgTitle', title);
            setElText('msgDesc', desc);
            setElDisplay('msgBox', 'block');
        }

        const video = document.getElementById("webcam");
        const canvas = document.getElementById("videoCanvas");
        const ctx = canvas ? canvas.getContext("2d") : null;

        // Persistent Offscreen Canvases (Mencegah GC Thrashing)
        const cleanCanvas = document.createElement('canvas');
        const cleanCtx = cleanCanvas.getContext('2d');

        const sharedTmpCanvas = document.createElement('canvas');
        const sharedTmpCtx = sharedTmpCanvas.getContext('2d');

        let isTracking = false, isStaticMedia = false, isRecording = false;
        let trackedFaces = [], poseLandmarks = null, nextFaceId = 1, lastFrameTime = 0, fps = 0;
        let activeMediaElement = null, animationFrameId = null, cameraStream = null, lastResults = null;
        let mediaRecorder = null, recordedChunks = [];
        let isTorchOn = false;
        let currentUploadedBlobUrl = null;
        let isTripwireBreached = false;
        let lastAlarmSoundTime = 0;

        // ==========================================
        // 2. AI & AUDIO INITIALIZATION
        // ==========================================
        let cocoModel = null;
        let isCocoLoading = true;

        if (window.tf) {
            tf.ready().then(() => {
                if (window.cocoSsd) {
                    cocoSsd.load({ base: 'lite_mobilenet_v2' }).then(model => {
                        cocoModel = model;
                        isCocoLoading = false;
                        const sText = document.getElementById("statusText");
                        if (sText && sText.textContent === "SYSTEM STANDBY") {
                            setElText("statusText", "AI READY");
                        }
                    }).catch(err => {
                        console.error("Gagal load model COCO-SSD:", err);
                        isCocoLoading = false;
                    });
                }
            });
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let lastBeepTime = 0;

        function playBeep() {
            if (!config.audioBeep || audioCtx.state === 'suspended') return;
            const now = performance.now();
            if (now - lastBeepTime < 100) return;
            lastBeepTime = now;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) { }
        }

        function playAlarmSiren() {
            if (!config.tripwireSound || audioCtx.state === 'suspended') return;
            const now = performance.now();
            if (now - lastAlarmSoundTime < 600) return; // Cooldown 600ms
            lastAlarmSoundTime = now;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(950, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(400, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) { }
        }

        const config = {
            trackingMode: "face", isMirrored: true, audioBeep: true,
            lensFilter: "none", localFilter: "none", shapeType: "box",
            boundingSize: 0, motionRate: 0.25, blobMode: "size", blobValue: 64,
            outlineColor: "#00FFFF", blockColor: "#000000", trailColor: "#10B981", textColor: "#FFFFFF",
            thickness: 2, fontSize: 12,
            drawTrails: true, drawConnections: true, centerHub: false, lineStyle: "solid",
            showIds: true, showMetrics: true, showTelemetry: true, showWatermark: true, showScanlines: true,
            // Tripwire State
            enableTripwire: false, tripwireSound: true, tripwirePos: 0.5, tripwireOrient: "horizontal"
        };

        function distance(p1, p2) { return Math.sqrt((p2.x - p1.x) ** 2 + (p2.y - p1.y) ** 2); }

        // ==========================================
        // 3. DRAWING & RENDERING SHAPES
        // ==========================================
        function drawShape(ctx, type, x, y, w, h, col, th, id, labelTxt, metricsTxt, targetObj) {
            ctx.save();
            ctx.strokeStyle = col; ctx.fillStyle = col;
            ctx.lineWidth = th; ctx.setLineDash([]); ctx.shadowBlur = 0;
            ctx.font = `bold ${config.fontSize}px Space Mono`;

            if (type === 'box') {
                ctx.strokeRect(x, y, w, h);
            }
            else if (type === 'solid') {
                ctx.fillStyle = config.blockColor;
                ctx.fillRect(x, y, w, h);
                ctx.strokeRect(x, y, w, h);
            }
            else if (type === 'glow') {
                ctx.shadowBlur = 15; ctx.shadowColor = col;
                ctx.strokeRect(x, y, w, h);
                ctx.shadowBlur = 0;
            }
            else if (type === 'dash') {
                ctx.setLineDash([10, 8]); ctx.strokeRect(x, y, w, h); ctx.setLineDash([]);
            }
            else if (type === 'frame') {
                ctx.strokeRect(x, y, w, h);
                const p = Math.min(w, h) * 0.1;
                if (p > 2) ctx.strokeRect(x + p, y + p, w - p * 2, h - p * 2);
            }
            else if (type === 'xframe') {
                ctx.strokeRect(x, y, w, h);
                ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y + h); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x + w, y); ctx.lineTo(x, y + h); ctx.stroke();
            }
            else if (type === 'grid') {
                ctx.strokeRect(x, y, w, h);
                ctx.beginPath();
                ctx.moveTo(x + w / 3, y); ctx.lineTo(x + w / 3, y + h);
                ctx.moveTo(x + 2 * w / 3, y); ctx.lineTo(x + 2 * w / 3, y + h);
                ctx.moveTo(x, y + h / 3); ctx.lineTo(x + w, y + h / 3);
                ctx.moveTo(x, y + 2 * h / 3); ctx.lineTo(x + w, y + 2 * h / 3);
                ctx.stroke();
            }
            else if (type === 'scope') {
                const cx = x + w / 2, cy = y + h / 2, r = Math.min(w, h) / 2;
                ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx - r - 15, cy); ctx.lineTo(cx + r + 15, cy); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx, cy - r - 15); ctx.lineTo(cx, cy + r + 15); ctx.stroke();
                ctx.fillRect(cx - 2, cy - 2, 4, 4);
            }
            else if (type === 'brackets') {
                const bl = Math.min(w, h) * 0.2;
                ctx.beginPath(); ctx.moveTo(x, y + bl); ctx.lineTo(x, y); ctx.lineTo(x + bl, y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x + w - bl, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + bl); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x, y + h - bl); ctx.lineTo(x, y + h); ctx.lineTo(x + bl, y + h); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x + w - bl, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - bl); ctx.stroke();
            }
            else if (type === 'cross') {
                const cx = x + w / 2, cy = y + h / 2, sz = Math.min(w, h) * 0.4;
                ctx.beginPath(); ctx.moveTo(cx - sz, cy); ctx.lineTo(cx + sz, cy); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx, cy - sz); ctx.lineTo(cx, cy + sz); ctx.stroke();
            }
            else if (type === 'particle') {
                for (let i = 0; i < 15; i++) {
                    let px = x + Math.random() * w; let py = y + Math.random() * h;
                    ctx.fillRect(px, py, th * 2, th * 2);
                }
                ctx.strokeRect(x, y, w, h);
            }
            else if (type === 'label') {
                let title = labelTxt !== "WAJAH" ? labelTxt : (config.showIds ? `TGT-${id}` : "TARGET");
                ctx.font = `bold ${config.fontSize}px Arial`;
                const textW = ctx.measureText(title).width + 8;
                ctx.fillStyle = config.blockColor || "#000"; ctx.fillRect(x, y, textW, config.fontSize + 8);
                ctx.fillStyle = config.textColor; ctx.fillText(title, x + 4, y + config.fontSize);
                ctx.restore();
                return;
            }
            else if (type === 'win2k') {
                const headerH = Math.max(16, config.fontSize + 6);
                const headerY = y < headerH ? y : y - headerH;
                ctx.fillStyle = col; ctx.strokeRect(x, y, w, h);
                ctx.fillStyle = "#0000AA"; ctx.fillRect(x, headerY, w, headerH);
                ctx.strokeRect(x, headerY, w, headerH);

                ctx.fillStyle = "#FFFFFF"; ctx.font = `${config.fontSize}px sans-serif`;
                let title = labelTxt !== "WAJAH" ? labelTxt : "Target";
                if (config.showIds) title = `ID:${id} ` + title;
                ctx.fillText(title, x + 4, headerY + headerH - 4);

                ctx.fillStyle = "#C0C0C0"; ctx.fillRect(x + w - headerH + 2, headerY + 2, headerH - 4, headerH - 4);
                ctx.fillStyle = "#000000"; ctx.fillText("x", x + w - headerH + 4, headerY + headerH - 4);

                if (config.showMetrics) {
                    ctx.fillStyle = config.textColor; ctx.font = `${config.fontSize}px Space Mono`;
                    ctx.fillText(metricsTxt, x + w / 4, y + h / 2);
                }
            }
            else if (type === 'labelBox') {
                const headerH = Math.max(16, config.fontSize + 6);
                const headerY = y < headerH ? y : y - headerH;
                ctx.strokeStyle = col; ctx.strokeRect(x, y, w, h);

                let title = labelTxt !== "WAJAH" ? labelTxt : "Object";
                if (config.showIds) title = `[ID:${id}] ` + title;
                ctx.font = `${config.fontSize}px Arial`;
                const textW = ctx.measureText(title).width + 8;

                ctx.fillStyle = "#FFFFFF"; ctx.fillRect(x, headerY, textW, headerH);
                ctx.fillStyle = "#000000"; ctx.fillText(title, x + 4, headerY + headerH - 4);

                if (config.showMetrics) {
                    ctx.fillStyle = config.textColor;
                    ctx.fillText(metricsTxt, x + 4, y + h + config.fontSize);
                }
            }

            // Standard Text Overlay
            if (type !== 'win2k' && type !== 'labelBox' && type !== 'label') {
                ctx.fillStyle = config.textColor; ctx.font = `bold ${config.fontSize}px Space Mono`;
                let txtY = y > 15 ? y - 8 : y + config.fontSize + 4;

                let titleParts = [];
                if (config.showIds) titleParts.push(`[ID:${id}]`);
                if (labelTxt && (labelTxt !== "WAJAH" || !config.showIds)) titleParts.push(labelTxt);

                if (titleParts.length > 0) ctx.fillText(titleParts.join(" "), x, txtY);

                // TELEMETRI & BIOMETRIK CYBERPUNK
                let lineOffset = y + h + config.fontSize + 4;
                if (config.showMetrics) {
                    ctx.fillStyle = config.textColor;
                    ctx.fillText(`V:${metricsTxt}`, x, lineOffset);
                    lineOffset += config.fontSize + 2;
                }

                if (config.showTelemetry && targetObj) {
                    const estDist = Math.max(0.4, (canvas.height / Math.max(1, h)) * 0.32).toFixed(1);
                    const pseudoTemp = (36.2 + ((id * 7) % 15) * 0.1).toFixed(1);
                    const vel = parseFloat(metricsTxt) || 0;
                    const threat = vel > 12 ? "HOSTILE" : (vel > 3 ? "CAUTION" : "PASSIVE");
                    const threatColor = threat === "HOSTILE" ? "#EF4444" : (threat === "CAUTION" ? "#F59E0B" : "#10B981");

                    ctx.fillStyle = threatColor;
                    ctx.fillText(`THR:[${threat}]`, x, lineOffset);
                    lineOffset += config.fontSize + 2;

                    ctx.fillStyle = config.textColor;
                    ctx.font = `${Math.max(9, config.fontSize - 2)}px Space Mono`;
                    ctx.fillText(`DST:${estDist}m TMP:${pseudoTemp}C`, x, lineOffset);
                }
            }
            ctx.restore();
        }

        // ==========================================
        // 4. ADVANCED PIXEL MANIPULATION VFX
        // ==========================================
        function applyPixelManipulation(targetCtx, type, rx, ry, rw, rh) {
            if (rw <= 0 || rh <= 0 || type === 'none' || type === 'pixelate' || type === 'zoom' || type === 'blur') return;

            const imgData = targetCtx.getImageData(rx, ry, rw, rh);
            const data = imgData.data;
            const cx = rw / 2; const cy = rh / 2;
            const maxRadius = Math.sqrt(cx * cx + cy * cy);
            const origData = new Uint8ClampedArray(data);
            const time = performance.now();

            if (type === 'glitch') {
                const glitchBlock = Math.floor(time / 120);
                for (let y = 0; y < rh; y++) {
                    let isGlitchLine = ((y + glitchBlock * 17) % 37 < 4) || ((y * 3 + glitchBlock * 7) % 73 === 0);
                    let shift = isGlitchLine ? Math.floor(((Math.sin(y * 0.5 + time * 0.01) + 1) * 8) - 4) : 2;
                    for (let x = 0; x < rw; x++) {
                        let idx = (y * rw + x) * 4;
                        let redX = Math.max(0, Math.min(rw - 1, x + shift));
                        let blueX = Math.max(0, Math.min(rw - 1, x - shift));
                        let redIdx = (y * rw + redX) * 4;
                        let blueIdx = (y * rw + blueX) * 4;
                        data[idx] = origData[redIdx];
                        data[idx + 1] = origData[idx + 1];
                        data[idx + 2] = origData[blueIdx + 2];
                    }
                }
            }
            else if (type === 'edge') {
                for (let y = 0; y < rh - 1; y++) {
                    for (let x = 0; x < rw - 1; x++) {
                        let idx = (y * rw + x) * 4;
                        let rightIdx = idx + 4;
                        let downIdx = ((y + 1) * rw + x) * 4;
                        let diffH = Math.abs(origData[idx] - origData[rightIdx]) + Math.abs(origData[idx + 1] - origData[rightIdx + 1]);
                        let diffV = Math.abs(origData[idx] - origData[downIdx]) + Math.abs(origData[idx + 1] - origData[downIdx + 1]);
                        let c = (diffH + diffV > 35) ? 255 : 0;
                        data[idx] = c; data[idx + 1] = c; data[idx + 2] = c;
                    }
                }
            }
            else if (type === 'crt') {
                for (let y = 0; y < rh; y++) {
                    let darken = (y % 3 === 0) ? 0.65 : 1.05;
                    for (let x = 0; x < rw; x++) {
                        let idx = (y * rw + x) * 4;
                        let rIdx = (y * rw + Math.max(0, x - 2)) * 4;
                        let bIdx = (y * rw + Math.min(rw - 1, x + 2)) * 4;
                        data[idx] = Math.min(255, origData[rIdx] * darken);
                        data[idx + 1] = Math.min(255, origData[idx + 1] * darken);
                        data[idx + 2] = Math.min(255, origData[bIdx + 2] * darken);
                    }
                }
            }
            else if (type === 'water') {
                for (let y = 0; y < rh; y++) {
                    let offset = Math.floor(Math.sin(y * 0.08 + time * 0.005) * 8);
                    for (let x = 0; x < rw; x++) {
                        let srcX = Math.max(0, Math.min(rw - 1, x + offset));
                        let dstIdx = (y * rw + x) * 4;
                        let srcIdx = (y * rw + srcX) * 4;
                        data[dstIdx] = origData[srcIdx];
                        data[dstIdx + 1] = origData[srcIdx + 1];
                        data[dstIdx + 2] = origData[srcIdx + 2];
                    }
                }
            }
            else if (type === 'nightvision') {
                const maxDist = maxRadius * 0.85;
                for (let y = 0; y < rh; y++) {
                    for (let x = 0; x < rw; x++) {
                        let idx = (y * rw + x) * 4;
                        let dist = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
                        let vignette = Math.max(0.2, 1.0 - Math.pow(dist / maxDist, 2.5));
                        let gray = (data[idx] * 0.299 + data[idx + 1] * 0.587 + data[idx + 2] * 0.114);
                        let noise = (Math.random() - 0.5) * 35;
                        data[idx] = 0;
                        data[idx + 1] = Math.max(0, Math.min(255, (gray * 1.7 + noise) * vignette));
                        data[idx + 2] = Math.max(0, Math.min(80, (gray * 0.2) * vignette));
                    }
                }
            }
            else {
                for (let i = 0; i < data.length; i += 4) {
                    if (type === 'invert') {
                        data[i] = 255 - data[i]; data[i + 1] = 255 - data[i + 1]; data[i + 2] = 255 - data[i + 2];
                    }
                    else if (type === 'thermal') {
                        const luma = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
                        if (luma < 64) {
                            data[i] = 0; data[i + 1] = Math.floor(luma * 2); data[i + 2] = Math.min(255, Math.floor(luma * 4));
                        } else if (luma < 128) {
                            let factor = (luma - 64) * 4;
                            data[i] = factor; data[i + 1] = 0; data[i + 2] = 255 - factor;
                        } else if (luma < 192) {
                            let factor = (luma - 128) * 4;
                            data[i] = 255; data[i + 1] = factor; data[i + 2] = 0;
                        } else {
                            let factor = (luma - 192) * 4;
                            data[i] = 255; data[i + 1] = 255; data[i + 2] = factor;
                        }
                    }
                    else if (type === 'dither') {
                        const luma = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
                        const threshold = 128 + (Math.random() * 64 - 32);
                        const bw = luma > threshold ? 255 : 0;
                        data[i] = bw; data[i + 1] = bw; data[i + 2] = bw;
                    }
                    else if (type === 'xray') {
                        const luma = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
                        const xray = 255 - luma;
                        data[i] = Math.min(255, xray * 1.2); data[i + 1] = Math.min(255, xray * 1.5 + 20); data[i + 2] = Math.min(255, xray * 1.5 + 50);
                    }
                    else if (type === 'tone') {
                        const luma = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
                        data[i] = Math.min(255, luma + 60); data[i + 1] = Math.min(255, luma + 30); data[i + 2] = Math.max(0, luma - 20);
                    }
                    else if (type === 'mask') {
                        data[i] = data[i] * 0.18; data[i + 1] = data[i + 1] * 0.18; data[i + 2] = data[i + 2] * 0.18;
                    }
                }
            }
            targetCtx.putImageData(imgData, rx, ry);
        }

        // ==========================================
        // 5. OBJECT & BLOB TRACKING ENGINE
        // ==========================================
        function updateTrackedFaces(detections, canvasWidth, canvasHeight) {
            let currentFaces = [];
            detections.forEach(det => {
                let box = det.boundingBox, lbl = det.label || "WAJAH";
                let w = box.width * canvasWidth, h = box.height * canvasHeight;
                let cx = box.xCenter * canvasWidth, cy = box.yCenter * canvasHeight;

                if (config.boundingSize > 0) {
                    w = config.boundingSize; h = config.boundingSize;
                }

                let x = cx - (w / 2), y = cy - (h / 2);
                currentFaces.push({ x, y, w, h, cx, cy, area: w * h, label: lbl });
            });

            const dynamicDistanceThreshold = Math.max(80, Math.min(canvasWidth, canvasHeight) * 0.2);
            const newTrackedFaces = [];

            currentFaces.forEach(cf => {
                let bestMatch = null, minDistance = dynamicDistanceThreshold;
                trackedFaces.forEach(tf => {
                    if (tf.claimed) return;
                    const dist = distance({ x: cf.cx, y: cf.cy }, { x: tf.cx, y: tf.cy });
                    if (dist < minDistance) { minDistance = dist; bestMatch = tf; }
                });

                if (bestMatch) {
                    bestMatch.claimed = true;
                    cf.id = bestMatch.id;
                    cf.history = bestMatch.history || [];
                    cf.history.push({ x: cf.cx, y: cf.cy });
                    if (cf.history.length > 20) cf.history.shift();
                    cf.vx = cf.cx - bestMatch.cx; cf.vy = cf.cy - bestMatch.cy;
                    cf.label = bestMatch.label || cf.label;
                } else {
                    cf.id = nextFaceId++;
                    cf.history = [{ x: cf.cx, y: cf.cy }];
                    cf.vx = 0; cf.vy = 0;
                    playBeep();
                }
                newTrackedFaces.push(cf);
            });
            trackedFaces = newTrackedFaces;
        }

        const motionRes = 64;

        function getPixelClusters(vidElement, canvasWidth, canvasHeight, mode) {
            if (!window.pixelCanvas) {
                window.pixelCanvas = document.createElement('canvas');
                window.pixelCanvas.width = motionRes; window.pixelCanvas.height = motionRes;
                window.pixelCtx = window.pixelCanvas.getContext('2d', { willReadFrequently: true });
            }
            const pCtx = window.pixelCtx;
            pCtx.drawImage(vidElement, 0, 0, motionRes, motionRes);
            const currData = pCtx.getImageData(0, 0, motionRes, motionRes).data;
            let detections = [];

            const sensitivity = parseFloat(config.motionRate);
            const motionThreshold = 25 + (sensitivity * 50);
            const lumaThreshold = 255 - (sensitivity * 120);

            let blobs = [];
            let mergeDist = config.blobMode === 'size' ? Math.max(2, config.blobValue / 8) : 6;

            for (let i = 0; i < currData.length; i += 4) {
                let isActive = false;

                if (mode === 'motion' && window.lastPixelData) {
                    let diff = Math.abs(currData[i] - window.lastPixelData[i]) +
                        Math.abs(currData[i + 1] - window.lastPixelData[i + 1]) +
                        Math.abs(currData[i + 2] - window.lastPixelData[i + 2]);
                    if (diff > motionThreshold) isActive = true;
                } else if (mode === 'luma') {
                    let luma = (currData[i] * 0.299 + currData[i + 1] * 0.587 + currData[i + 2] * 0.114);
                    if (luma > lumaThreshold) isActive = true;
                }

                if (isActive) {
                    let pxlIdx = i / 4;
                    let x = pxlIdx % motionRes;
                    let y = Math.floor(pxlIdx / motionRes);

                    let matchedBlob = null;
                    for (let b of blobs) {
                        let dx = Math.max(b.minX - x, 0, x - b.maxX);
                        let dy = Math.max(b.minY - y, 0, y - b.maxY);
                        if (dx <= mergeDist && dy <= mergeDist) {
                            matchedBlob = b; break;
                        }
                    }

                    if (matchedBlob) {
                        matchedBlob.sumX += x; matchedBlob.sumY += y; matchedBlob.count++;
                        if (x < matchedBlob.minX) matchedBlob.minX = x;
                        if (x > matchedBlob.maxX) matchedBlob.maxX = x;
                        if (y < matchedBlob.minY) matchedBlob.minY = y;
                        if (y > matchedBlob.maxY) matchedBlob.maxY = y;
                    } else {
                        blobs.push({ sumX: x, sumY: y, count: 1, minX: x, maxX: x, minY: y, maxY: y });
                    }
                }
            }

            window.lastPixelData = new Uint8ClampedArray(currData);

            let validBlobs = [];
            for (let b of blobs) {
                if (b.count > 2) {
                    let cx = b.sumX / b.count;
                    let cy = b.sumY / b.count;
                    let w = Math.max(2, b.maxX - b.minX);
                    let h = Math.max(2, b.maxY - b.minY);
                    validBlobs.push({ cx, cy, w, h, area: w * h });
                }
            }

            if (config.blobMode === 'count') {
                validBlobs.sort((a, b) => b.area - a.area);
                validBlobs = validBlobs.slice(0, config.blobValue);
            }

            for (let v of validBlobs) {
                detections.push({
                    boundingBox: {
                        xCenter: v.cx / motionRes,
                        yCenter: v.cy / motionRes,
                        width: v.w / motionRes,
                        height: v.h / motionRes
                    },
                    label: mode === 'luma' ? "LUMA" : "MOTION"
                });
            }
            return detections;
        }

        // MediaPipe Face
        const faceDetection = new FaceDetection({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${f}` });
        faceDetection.setOptions({ model: 'short', minDetectionConfidence: 0.5 });
        faceDetection.onResults((res) => {
            if (isTracking && config.trackingMode === 'face') {
                processResultsWrapper(res.image, res.detections || []);
            }
        });

        // MediaPipe Pose
        const poseDetection = new Pose({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}` });
        poseDetection.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        poseDetection.onResults((res) => {
            if (isTracking && config.trackingMode === 'pose') {
                poseLandmarks = res.poseLandmarks || null;
                let mockDetections = [];
                if (poseLandmarks && poseLandmarks.length > 0) {
                    let xs = poseLandmarks.map(p => p.x), ys = poseLandmarks.map(p => p.y);
                    let minX = Math.max(0, Math.min(...xs)), maxX = Math.min(1, Math.max(...xs));
                    let minY = Math.max(0, Math.min(...ys)), maxY = Math.min(1, Math.max(...ys));
                    mockDetections.push({
                        boundingBox: {
                            xCenter: (minX + maxX) / 2,
                            yCenter: (minY + maxY) / 2,
                            width: Math.max(0.1, maxX - minX),
                            height: Math.max(0.1, maxY - minY)
                        },
                        label: "POSE"
                    });
                }
                processResultsWrapper(res.image, mockDetections);
            }
        });

        function processResultsWrapper(imageSrc, detectionsRaw) {
            if (!isTracking) return;
            lastResults = { image: imageSrc };
            if (config.trackingMode !== 'pose') poseLandmarks = null;

            if (!isStaticMedia) {
                const now = performance.now();
                if (now - lastFrameTime > 0) fps = 1000 / (now - lastFrameTime);
                lastFrameTime = now;
                setElText("fpsDisplay", Math.round(fps));
            } else {
                setElText("fpsDisplay", "STATIC");
            }

            if (canvas) updateTrackedFaces(detectionsRaw, canvas.width, canvas.height);
            setElText("targetCount", trackedFaces.length);
            renderVisuals();
        }

        // ==========================================
        // 6. TRACKER LOOPS & STATIC MEDIA
        // ==========================================
        let lastMotionScanTime = 0;
        let lastCocoScanTime = 0;
        let isDetectingCoco = false;

        async function processStaticMedia() {
            if (!activeMediaElement || !isStaticMedia) return;
            setElText("statusText", "ANALYZING IMAGE...");

            if (config.trackingMode === 'face') {
                await faceDetection.send({ image: activeMediaElement });
            } else if (config.trackingMode === 'pose') {
                await poseDetection.send({ image: activeMediaElement });
            } else if (config.trackingMode === 'motion' || config.trackingMode === 'luma') {
                const mockDet = getPixelClusters(activeMediaElement, canvas.width, canvas.height, config.trackingMode);
                processResultsWrapper(activeMediaElement, mockDet);
            } else if (cocoModel) {
                const preds = await cocoModel.detect(activeMediaElement, 50, 0.25);
                let tClasses = config.trackingMode === 'person' ? ['person'] :
                    config.trackingMode === 'animal' ? ['cat', 'dog', 'bird', 'horse', 'cow', 'sheep', 'bear', 'zebra', 'giraffe', 'elephant', 'teddy bear'] :
                        ['potted plant'];

                const filtered = preds.filter(p => tClasses.includes(p.class.toLowerCase()));
                const cw = activeMediaElement.width || activeMediaElement.videoWidth || 1;
                const ch = activeMediaElement.height || activeMediaElement.videoHeight || 1;

                let mockDet = filtered.map(d => {
                    let finalLabel = d.class.toUpperCase();
                    if (config.trackingMode === 'animal') finalLabel = "ANIMAL";
                    return {
                        boundingBox: {
                            xCenter: (d.bbox[0] + d.bbox[2] / 2) / cw,
                            yCenter: (d.bbox[1] + d.bbox[3] / 2) / ch,
                            width: d.bbox[2] / cw,
                            height: d.bbox[3] / ch
                        },
                        label: finalLabel
                    };
                });
                processResultsWrapper(activeMediaElement, mockDet);
            } else if (isCocoLoading) {
                showMsg("MEMUAT AI", "Model pendeteksi AI sedang diunduh, harap tunggu beberapa saat.");
            }
            setElText("statusText", "IMAGE READY");
        }

        async function runTrackerLoop() {
            if (!isTracking || !activeMediaElement || isStaticMedia) return;
            try {
                if (activeMediaElement.tagName === 'VIDEO' && activeMediaElement.readyState >= 2 && !activeMediaElement.paused) {
                    if (config.trackingMode === 'face') {
                        await faceDetection.send({ image: activeMediaElement });
                    } else if (config.trackingMode === 'pose') {
                        await poseDetection.send({ image: activeMediaElement });
                    } else if (config.trackingMode === 'motion' || config.trackingMode === 'luma') {
                        const now = performance.now();
                        if (now - lastMotionScanTime > 50) {
                            lastMotionScanTime = now;
                            const mockDet = getPixelClusters(activeMediaElement, canvas.width, canvas.height, config.trackingMode);
                            processResultsWrapper(activeMediaElement, mockDet);
                        } else {
                            renderVisuals();
                        }
                    } else if (cocoModel) {
                        const now = performance.now();
                        if (now - lastCocoScanTime > 120 && !isDetectingCoco) {
                            isDetectingCoco = true;
                            lastCocoScanTime = now;

                            const cw = activeMediaElement.videoWidth || activeMediaElement.width;
                            const ch = activeMediaElement.videoHeight || activeMediaElement.height;

                            if (cw && ch) {
                                cocoModel.detect(activeMediaElement, 50, 0.25).then(preds => {
                                    if (!isTracking) { isDetectingCoco = false; return; }
                                    let tClasses = config.trackingMode === 'person' ? ['person'] :
                                        config.trackingMode === 'animal' ? ['cat', 'dog', 'bird', 'horse', 'cow', 'sheep', 'bear', 'zebra', 'giraffe', 'elephant', 'teddy bear'] :
                                            ['potted plant'];

                                    const filtered = preds.filter(p => tClasses.includes(p.class.toLowerCase()));
                                    let mockDet = filtered.map(d => {
                                        let finalLabel = d.class.toUpperCase();
                                        if (config.trackingMode === 'animal') finalLabel = "ANIMAL";
                                        return {
                                            boundingBox: {
                                                xCenter: (d.bbox[0] + d.bbox[2] / 2) / cw,
                                                yCenter: (d.bbox[1] + d.bbox[3] / 2) / ch,
                                                width: d.bbox[2] / cw,
                                                height: d.bbox[3] / ch
                                            },
                                            label: finalLabel
                                        };
                                    });
                                    processResultsWrapper(activeMediaElement, mockDet);
                                    isDetectingCoco = false;
                                }).catch(() => { isDetectingCoco = false; });
                            } else {
                                isDetectingCoco = false;
                            }
                        } else {
                            renderVisuals();
                        }
                    }
                }
            } catch (err) { console.error(err); }

            if (isTracking && !isStaticMedia) {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                animationFrameId = requestAnimationFrame(runTrackerLoop);
            }
        }

        function drawConnectLine(ctx, x1, y1, x2, y2, style) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            if (style === 'dashed') {
                ctx.setLineDash([10, 10]);
                ctx.lineTo(x2, y2);
            } else if (style === 'curve') {
                ctx.setLineDash([]);
                let mx = (x1 + x2) / 2;
                ctx.quadraticCurveTo(mx, y1, x2, y2);
            } else if (style === 'step') {
                ctx.setLineDash([]);
                ctx.lineTo(x2, y1);
                ctx.lineTo(x2, y2);
            } else {
                ctx.setLineDash([]);
                ctx.lineTo(x2, y2);
            }
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // ==========================================
        // 7. COMPOSITING VISUALS (DUAL-LAYER + TRIPWIRE)
        // ==========================================
        function renderVisuals() {
            if (!isTracking || !lastResults || !ctx) return;
            const w = canvas.width, h = canvas.height;
            if (w <= 0 || h <= 0) return;

            // STEP 1: Persiapkan Clean Canvas (Frame Asli)
            cleanCanvas.width = w;
            cleanCanvas.height = h;
            cleanCtx.save();
            if (config.isMirrored) {
                cleanCtx.translate(w, 0);
                cleanCtx.scale(-1, 1);
            }
            cleanCtx.drawImage(lastResults.image, 0, 0, w, h);
            cleanCtx.restore();

            // STEP 2: Render Layer Latar (Global Filter)
            ctx.clearRect(0, 0, w, h);

            if (config.lensFilter === 'none') {
                ctx.drawImage(cleanCanvas, 0, 0);
            } else if (config.lensFilter === 'blur') {
                ctx.save();
                ctx.filter = 'blur(10px)';
                ctx.drawImage(cleanCanvas, 0, 0);
                ctx.restore();
            } else if (config.lensFilter === 'pixelate') {
                sharedTmpCanvas.width = Math.max(1, Math.floor(w * 0.04));
                sharedTmpCanvas.height = Math.max(1, Math.floor(h * 0.04));
                sharedTmpCtx.drawImage(cleanCanvas, 0, 0, sharedTmpCanvas.width, sharedTmpCanvas.height);
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(sharedTmpCanvas, 0, 0, sharedTmpCanvas.width, sharedTmpCanvas.height, 0, 0, w, h);
                ctx.imageSmoothingEnabled = true;
            } else if (config.lensFilter === 'zoom') {
                ctx.drawImage(cleanCanvas, w * 0.15, h * 0.15, w * 0.7, h * 0.7, 0, 0, w, h);
            } else {
                ctx.drawImage(cleanCanvas, 0, 0);
                applyPixelManipulation(ctx, config.lensFilter, 0, 0, w, h);
            }

            const getDrawX = (x, boxW) => config.isMirrored ? w - x - boxW : x;
            const getDrawCX = (cx) => config.isMirrored ? w - cx : cx;

            // STEP 3: Render Layer Objek (Dalam Kotak / Local Filter)
            isTripwireBreached = false;
            let tripwireCoord = config.tripwireOrient === 'horizontal' ? h * config.tripwirePos : w * config.tripwirePos;

            if (trackedFaces.length > 0) {
                trackedFaces.forEach(f => {
                    let rx = Math.floor(getDrawX(f.x, f.w)), ry = Math.floor(f.y), rw = Math.floor(f.w), rh = Math.floor(f.h);

                    let cx1 = Math.max(0, rx), cy1 = Math.max(0, ry);
                    let cx2 = Math.min(w, rx + rw), cy2 = Math.min(h, ry + rh);
                    let crw = cx2 - cx1, crh = cy2 - cy1;

                    // Cek Deteksi Pelanggaran Tripwire
                    if (config.enableTripwire) {
                        if (config.tripwireOrient === 'horizontal') {
                            if (ry <= tripwireCoord && (ry + rh) >= tripwireCoord) isTripwireBreached = true;
                        } else {
                            if (rx <= tripwireCoord && (rx + rw) >= tripwireCoord) isTripwireBreached = true;
                        }
                    }

                    if (crw > 0 && crh > 0) {
                        if (config.localFilter === 'none') {
                            if (config.lensFilter !== 'none') {
                                ctx.drawImage(cleanCanvas, cx1, cy1, crw, crh, cx1, cy1, crw, crh);
                            }
                        } else {
                            sharedTmpCanvas.width = crw;
                            sharedTmpCanvas.height = crh;

                            if (config.localFilter === 'blur') {
                                sharedTmpCtx.save();
                                sharedTmpCtx.filter = 'blur(12px)';
                                sharedTmpCtx.drawImage(cleanCanvas, cx1, cy1, crw, crh, 0, 0, crw, crh);
                                sharedTmpCtx.restore();
                                ctx.drawImage(sharedTmpCanvas, cx1, cy1);
                            } else if (config.localFilter === 'pixelate') {
                                const pxW = Math.max(1, Math.floor(crw * 0.1)), pxH = Math.max(1, Math.floor(crh * 0.1));
                                const pCanvas = document.createElement('canvas');
                                pCanvas.width = pxW; pCanvas.height = pxH;
                                pCanvas.getContext('2d').drawImage(cleanCanvas, cx1, cy1, crw, crh, 0, 0, pxW, pxH);
                                ctx.imageSmoothingEnabled = false;
                                ctx.drawImage(pCanvas, 0, 0, pxW, pxH, cx1, cy1, crw, crh);
                                ctx.imageSmoothingEnabled = true;
                            } else if (config.localFilter === 'zoom') {
                                sharedTmpCtx.drawImage(cleanCanvas, cx1 + crw * 0.2, cy1 + crh * 0.2, crw * 0.6, crh * 0.6, 0, 0, crw, crh);
                                ctx.drawImage(sharedTmpCanvas, cx1, cy1);
                            } else {
                                sharedTmpCtx.drawImage(cleanCanvas, cx1, cy1, crw, crh, 0, 0, crw, crh);
                                applyPixelManipulation(sharedTmpCtx, config.localFilter, 0, 0, crw, crh);
                                ctx.drawImage(sharedTmpCanvas, cx1, cy1);
                            }
                        }
                    }
                });
            }

            // STEP 4: Render Garis Tripwire & Alarm
            if (config.enableTripwire) {
                ctx.save();
                ctx.lineWidth = isTripwireBreached ? 3 : 1.5;
                ctx.strokeStyle = isTripwireBreached ? "#EF4444" : "#F59E0B";
                ctx.setLineDash([8, 6]);
                ctx.beginPath();
                if (config.tripwireOrient === 'horizontal') {
                    ctx.moveTo(0, tripwireCoord); ctx.lineTo(w, tripwireCoord);
                } else {
                    ctx.moveTo(tripwireCoord, 0); ctx.lineTo(tripwireCoord, h);
                }
                ctx.stroke();

                // Tripwire Badge Label
                ctx.fillStyle = isTripwireBreached ? "#EF4444" : "#F59E0B";
                ctx.font = "bold 9px Space Mono";
                const twLabel = isTripwireBreached ? "TRIPWIRE: BREACHED [ALERT]" : "TRIPWIRE: ACTIVE";
                ctx.fillText(twLabel, 16, config.tripwireOrient === 'horizontal' ? Math.max(16, tripwireCoord - 6) : 32);
                ctx.restore();

                if (isTripwireBreached) {
                    playAlarmSiren();
                    // Flashing Alarm Banner
                    ctx.fillStyle = "rgba(239, 68, 68, 0.18)";
                    ctx.fillRect(0, 0, w, h);

                    setElText("statusText", "INTRUSION DETECTED");
                    const st = document.getElementById("statusText");
                    if (st) st.style.color = "#EF4444";
                } else {
                    const st = document.getElementById("statusText");
                    if (st && isTracking) {
                        st.textContent = "TRACKING ACTIVE";
                        st.style.color = "#10B981";
                    }
                }
            }

            // STEP 5: Render Vektor UI (Jaring, Jejak, Garis Kotak)
            const ocol = config.outlineColor, tcol = config.trailColor;
            ctx.strokeStyle = tcol; ctx.lineWidth = config.thickness;

            if (config.drawConnections && trackedFaces.length > 1) {
                if (!config.centerHub) {
                    for (let i = 0; i < trackedFaces.length; i++) {
                        for (let j = i + 1; j < trackedFaces.length; j++) {
                            drawConnectLine(ctx, getDrawCX(trackedFaces[i].cx), trackedFaces[i].cy, getDrawCX(trackedFaces[j].cx), trackedFaces[j].cy, config.lineStyle);
                        }
                    }
                } else {
                    for (let i = 1; i < trackedFaces.length; i++) {
                        drawConnectLine(ctx, getDrawCX(trackedFaces[0].cx), trackedFaces[0].cy, getDrawCX(trackedFaces[i].cx), trackedFaces[i].cy, config.lineStyle);
                    }
                }
            }

            if (config.drawTrails) {
                ctx.setLineDash([]);
                trackedFaces.forEach(f => {
                    if (f.history && f.history.length > 1) {
                        ctx.beginPath();
                        ctx.moveTo(getDrawCX(f.history[0].x), f.history[0].y);
                        for (let i = 1; i < f.history.length; i++) ctx.lineTo(getDrawCX(f.history[i].x), f.history[i].y);
                        ctx.stroke();
                    }
                });
            }

            if (poseLandmarks && config.trackingMode === 'pose') {
                ctx.strokeStyle = config.outlineColor;
                ctx.fillStyle = config.outlineColor;
                ctx.lineWidth = config.thickness;

                const skeleton = [
                    [11, 12], [11, 13], [13, 15], [15, 17], [15, 19], [15, 21],
                    [12, 14], [14, 16], [16, 18], [16, 20], [16, 22],
                    [11, 23], [12, 24], [23, 24],
                    [23, 25], [25, 27], [27, 29], [27, 31], [29, 31],
                    [24, 26], [26, 28], [28, 30], [28, 32], [30, 32],
                    [0, 1], [1, 2], [2, 3], [3, 7], [0, 4], [4, 5], [5, 6], [6, 8], [9, 10]
                ];

                skeleton.forEach(pair => {
                    const p1 = poseLandmarks[pair[0]];
                    const p2 = poseLandmarks[pair[1]];
                    if (p1 && p2 && (p1.visibility ?? 1) > 0.4 && (p2.visibility ?? 1) > 0.4) {
                        drawConnectLine(ctx, getDrawCX(p1.x * w), p1.y * h, getDrawCX(p2.x * w), p2.y * h, config.lineStyle);
                    }
                });

                ctx.setLineDash([]);
                poseLandmarks.forEach((lm, idx) => {
                    if ((lm.visibility ?? 1) > 0.4) {
                        let nx = getDrawCX(lm.x * w);
                        let ny = lm.y * h;
                        if (config.shapeType === 'particle') {
                            ctx.fillRect(nx - 2, ny - 2, 4, 4);
                        } else if (config.shapeType === 'glow') {
                            ctx.shadowBlur = 15; ctx.shadowColor = config.outlineColor;
                            ctx.beginPath(); ctx.arc(nx, ny, config.thickness * 2, 0, 2 * Math.PI); ctx.fill();
                            ctx.shadowBlur = 0;
                        } else {
                            ctx.strokeRect(nx - config.thickness, ny - config.thickness, config.thickness * 2, config.thickness * 2);
                        }

                        if (config.showIds && (idx === 0 || idx === 15 || idx === 16 || idx === 27 || idx === 28)) {
                            ctx.fillStyle = config.textColor;
                            ctx.font = `${config.fontSize}px Space Mono`;
                            ctx.fillText(`J-${idx}`, nx + 8, ny - 8);
                            ctx.fillStyle = config.outlineColor;
                        }
                    }
                });
            }

            trackedFaces.forEach(f => {
                let dx = getDrawX(f.x, f.w);
                let vel = Math.sqrt((f.vx || 0) ** 2 + (f.vy || 0) ** 2).toFixed(2);
                drawShape(ctx, config.shapeType, dx, f.y, f.w, f.h, ocol, config.thickness, f.id, f.label, vel, f);
            });

            // STEP 6: Watermark & Timecode CCTV
            if (config.showWatermark) {
                ctx.save();
                const now = new Date();
                const timeStr = now.toISOString().replace("T", " ").replace("Z", "");
                const isBlink = Math.floor(now.getTime() / 500) % 2 === 0;

                ctx.font = "bold 10px Space Mono";
                ctx.fillStyle = isBlink ? "#EF4444" : "rgba(239,68,68,0.2)";
                ctx.fillText("REC ●", w - 75, 24);

                ctx.fillStyle = "#FFFFFF";
                ctx.fillText(`CAM-01 [ENC]`, w - 180, 24);
                ctx.font = "9px Space Mono";
                ctx.fillStyle = "rgba(255,255,255,0.75)";
                ctx.fillText(timeStr, w - 210, 40);
                ctx.fillText("RIDDLEBUSH // SEC_SYS v3.0", 18, h - 16);
                ctx.restore();
            }
        }

        // ==========================================
        // 8. CAMERA & SYSTEM CONTROLLER
        // ==========================================
        function stopSystem() {
            isTracking = false;
            isStaticMedia = false;

            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }

            if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') {
                try { mediaRecorder.stop(); } catch (e) { }
                isRecording = false;
                const recBtn = document.getElementById("recordVideoBtn");
                if (recBtn) {
                    recBtn.textContent = "REKAM KAMERA";
                    recBtn.style.borderColor = "#EF4444";
                    recBtn.style.color = "#EF4444";
                }
            }

            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
            }

            if (video) {
                video.pause();
                video.srcObject = null;
                video.src = "";
                video.onplay = null;
                video.onloadedmetadata = null;
            }

            if (currentUploadedBlobUrl) {
                URL.revokeObjectURL(currentUploadedBlobUrl);
                currentUploadedBlobUrl = null;
            }

            activeMediaElement = null;
            lastResults = null;
            window.lastPixelData = null;
            poseLandmarks = null;

            if (ctx && canvas) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            trackedFaces = [];
            nextFaceId = 1;

            setElText("statusText", "SYSTEM STANDBY");
            const st = document.getElementById("statusText");
            if (st) st.style.color = "#10B981";
            setElText("targetCount", "0");
            setElText("fpsDisplay", "0");

            setElDisplay("stopBtn", "none");
            setElDisplay("cameraBtn", "block");
            setElDisplay("torchBtn", "none");
            setElDisplay("playPauseBtn", "none");
            setElDisplay("autoRenderBtn", "none");

            const tBtn = document.getElementById('torchBtn');
            if (tBtn) {
                tBtn.textContent = "SENTER";
                tBtn.style.backgroundColor = "transparent";
                tBtn.style.color = "#00FFFF";
            }
            isTorchOn = false;
        }

        async function toggleTorch() {
            if (!cameraStream) return;
            const track = cameraStream.getVideoTracks()[0];
            if (!track) return;
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            if (capabilities.torch) {
                isTorchOn = !isTorchOn;
                try {
                    await track.applyConstraints({ advanced: [{ torch: isTorchOn }] });
                    const tBtn = document.getElementById('torchBtn');
                    if (tBtn) {
                        tBtn.textContent = isTorchOn ? "MATIKAN SENTER" : "SENTER";
                        tBtn.style.backgroundColor = isTorchOn ? "#00FFFF" : "transparent";
                        tBtn.style.color = isTorchOn ? "#000" : "#00FFFF";
                    }
                } catch (e) { console.error(e); }
            } else {
                showMsg("TIDAK DIDUKUNG", "Kamera perangkat ini tidak mendukung fitur senter.");
            }
        }

        async function getDevices() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                const select = document.getElementById('cameraSelect');

                if (select && videoDevices.length > 0 && videoDevices[0].label !== "") {
                    const currentVal = select.value;
                    select.innerHTML = '';

                    const optUser = document.createElement('option');
                    optUser.value = "user"; optUser.text = "Kamera Depan (Default)";
                    select.appendChild(optUser);

                    const optEnv = document.createElement('option');
                    optEnv.value = "environment"; optEnv.text = "Kamera Belakang (Default)";
                    select.appendChild(optEnv);

                    videoDevices.forEach((device, index) => {
                        const option = document.createElement('option');
                        option.value = device.deviceId;
                        option.text = device.label || `Lensa Kamera ${index + 1}`;
                        select.appendChild(option);
                    });

                    select.value = currentVal;
                }
            } catch (err) { console.log("Gagal memuat list hardware kamera:", err); }
        }

        async function startCamera() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const camSelect = document.getElementById("cameraSelect");
            const selectedDevice = camSelect ? camSelect.value : "user";

            stopSystem();
            setElText("statusText", "CONNECTING...");

            let videoConstraints = { width: { ideal: 1280 }, height: { ideal: 720 } };

            if (selectedDevice === 'user' || selectedDevice === 'environment') {
                videoConstraints.facingMode = selectedDevice;
            } else {
                videoConstraints.deviceId = { exact: selectedDevice };
            }

            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: false });
                const track = cameraStream.getVideoTracks()[0];
                const label = track ? track.label.toLowerCase() : "";

                const mChk = document.getElementById("isMirrored");
                if (selectedDevice === 'user' || label.includes('front') || label.includes('depan')) {
                    config.isMirrored = true;
                    if (mChk) mChk.checked = true;
                } else {
                    config.isMirrored = false;
                    if (mChk) mChk.checked = false;
                }

                if (track && track.getCapabilities && typeof track.getCapabilities === 'function') {
                    if (track.getCapabilities().torch) {
                        setElDisplay("torchBtn", "block");
                    }
                }

                if (video) {
                    video.srcObject = cameraStream;
                    video.muted = true;
                    video.onloadedmetadata = () => {
                        if (canvas) {
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                        }
                        video.play().then(() => {
                            activeMediaElement = video;
                            isTracking = true;
                            setElText("statusText", "TRACKING ACTIVE");

                            setElDisplay("cameraBtn", "none");
                            setElDisplay("stopBtn", "block");
                            setElDisplay("playPauseBtn", "none");
                            setElDisplay("autoRenderBtn", "none");

                            getDevices();
                            if (animationFrameId) cancelAnimationFrame(animationFrameId);
                            runTrackerLoop();
                        }).catch(e => console.error("Video play failed:", e));
                    };
                }
            } catch (err) {
                console.error(err);
                showMsg("GAGAL BUKA KAMERA", "Pastikan memberikan izin akses kamera pada browser.");
                setElText("statusText", "SYSTEM STANDBY");
            }
        }

        // ==========================================
        // 9. EVENT LISTENERS & BINDINGS
        // ==========================================
        const btnCamera = document.getElementById("cameraBtn"); if (btnCamera) btnCamera.addEventListener("click", startCamera);
        const btnStop = document.getElementById("stopBtn"); if (btnStop) btnStop.addEventListener("click", stopSystem);
        const btnTorch = document.getElementById("torchBtn"); if (btnTorch) btnTorch.addEventListener("click", toggleTorch);
        const selCamera = document.getElementById("cameraSelect"); if (selCamera) selCamera.addEventListener("change", () => { if (isTracking && !isStaticMedia) startCamera(); });

        // HUD Fullscreen Toggle
        function toggleHudMode() {
            document.body.classList.toggle("hud-mode");
        }
        const btnToggleHud = document.getElementById("btnToggleHud");
        if (btnToggleHud) btnToggleHud.addEventListener("click", toggleHudMode);
        const hudExitBtn = document.getElementById("hudExitBtn");
        if (hudExitBtn) hudExitBtn.addEventListener("click", toggleHudMode);

        // Double tap canvas atau tekan tombol H untuk HUD Mode
        if (canvas) {
            canvas.addEventListener("dblclick", toggleHudMode);
        }
        window.addEventListener("keydown", (e) => {
            if (e.key === "h" || e.key === "H") toggleHudMode();
            if (e.key === "Escape" && document.body.classList.contains("hud-mode")) toggleHudMode();
        });

        // 1-Click Preset Themes
        const themePresets = {
            cyberpunk: { outline: "#00FFFF", block: "#000000", trail: "#F59E0B", text: "#00FFFF", lens: "none", local: "none", shape: "brackets" },
            matrix: { outline: "#00FF66", block: "#051A0A", trail: "#00FF66", text: "#80FF80", lens: "none", local: "none", shape: "grid" },
            military: { outline: "#10B981", block: "#001A00", trail: "#EF4444", text: "#10B981", lens: "nightvision", local: "thermal", shape: "scope" },
            synthwave: { outline: "#FF007F", block: "#1A0022", trail: "#00F0FF", text: "#FFE600", lens: "crt", local: "glitch", shape: "win2k" },
            stealth: { outline: "#888888", block: "#000000", trail: "#444444", text: "#FFFFFF", lens: "mask", local: "pixelate", shape: "solid" }
        };

        const themeSel = document.getElementById("themePreset");
        if (themeSel) {
            themeSel.addEventListener("change", (e) => {
                const pr = themePresets[e.target.value];
                if (pr) {
                    config.outlineColor = pr.outline;
                    config.blockColor = pr.block;
                    config.trailColor = pr.trail;
                    config.textColor = pr.text;
                    config.lensFilter = pr.lens;
                    config.localFilter = pr.local;
                    config.shapeType = pr.shape;

                    const setVal = (id, val) => { const el = document.getElementById(id); if (el) el.value = val; };
                    setVal("outlineColor", pr.outline);
                    setVal("blockColor", pr.block);
                    setVal("trailColor", pr.trail);
                    setVal("textColor", pr.text);
                    setVal("lensFilter", pr.lens);
                    setVal("localFilter", pr.local);
                    setVal("shapeType", pr.shape);

                    if (isTracking && isStaticMedia) renderVisuals();
                }
            });
        }

        const btnPlayPause = document.getElementById("playPauseBtn");
        if (btnPlayPause) {
            btnPlayPause.addEventListener("click", () => {
                if (activeMediaElement && activeMediaElement.tagName === 'VIDEO') {
                    if (activeMediaElement.paused) {
                        activeMediaElement.play().then(() => {
                            setElText("statusText", "VIDEO PREVIEW (PLAYING)");
                            if (animationFrameId) cancelAnimationFrame(animationFrameId);
                            runTrackerLoop();
                        });
                    } else {
                        activeMediaElement.pause();
                        setElText("statusText", "VIDEO PREVIEW (PAUSED)");
                    }
                }
            });
        }

        const binds = [
            {
                id: "trackingMode", type: "value", cb: () => {
                    setElDisplay("motionRateContainer", (config.trackingMode === 'motion' || config.trackingMode === 'luma') ? 'block' : 'none');
                    setElDisplay("blobControlContainer", (config.trackingMode === 'motion' || config.trackingMode === 'luma') ? 'block' : 'none');
                    window.lastPixelData = null;
                    if (isStaticMedia) { processStaticMedia(); }
                }
            },
            { id: "isMirrored", type: "checked" }, { id: "centerHub", type: "checked" },
            { id: "lensFilter", type: "value" }, { id: "localFilter", type: "value" },
            { id: "shapeType", type: "value" }, { id: "outlineColor", type: "value" }, { id: "blockColor", type: "value" }, { id: "trailColor", type: "value" }, { id: "textColor", type: "value" },
            { id: "drawConnections", type: "checked" }, { id: "drawTrails", type: "checked" }, { id: "audioBeep", type: "checked" },
            { id: "showIds", type: "checked" }, { id: "showMetrics", type: "checked" }, { id: "showTelemetry", type: "checked" }, { id: "showWatermark", type: "checked" },
            { id: "enableTripwire", type: "checked" }, { id: "tripwireSound", type: "checked" },
            {
                id: "showScanlines", type: "checked", cb: () => {
                    const cContainer = document.getElementById("canvas-container");
                    if (cContainer) cContainer.classList.toggle("scanlines-active", config.showScanlines);
                }
            }
        ];

        binds.forEach(b => {
            const el = document.getElementById(b.id);
            if (el) {
                el.addEventListener("change", (e) => {
                    if (b.type === "value") config[b.id] = e.target.value;
                    else if (b.type === "checked") config[b.id] = e.target.checked;
                    if (b.cb) b.cb();
                    if (isTracking && isStaticMedia) renderVisuals();
                });
            }
        });

        // Tripwire Sliders
        const twPosEl = document.getElementById("tripwirePos");
        if (twPosEl) {
            twPosEl.addEventListener("input", (e) => {
                config.tripwirePos = parseInt(e.target.value) / 100;
                setElText("tripwirePosVal", e.target.value + "%");
                if (isTracking && isStaticMedia) renderVisuals();
            });
        }
        document.querySelectorAll('input[name="tripwireOrient"]').forEach(elem => {
            elem.addEventListener("change", (e) => {
                config.tripwireOrient = e.target.value;
                if (isTracking && isStaticMedia) renderVisuals();
            });
        });

        const segmentedAndSlidedBinds = [
            { name: "mrate", var: "motionRate", isFloat: true },
            { name: "blobVal", var: "blobValue", isFloat: false },
            { name: "bsize", var: "boundingSize", isFloat: false },
            { name: "lineStyle", var: "lineStyle", isFloat: false }
        ];

        segmentedAndSlidedBinds.forEach(sb => {
            document.querySelectorAll(`input[name="${sb.name}"]`).forEach((elem) => {
                elem.addEventListener("change", function (e) {
                    let val = e.target.value;
                    config[sb.var] = sb.isFloat ? parseFloat(val) : (isNaN(val) ? val : parseInt(val));

                    if (sb.name === "mrate") setElText("mrateLabel", val);
                    if (isTracking && isStaticMedia) {
                        if (sb.name.includes("blob") || sb.name === "mrate") processStaticMedia(); else renderVisuals();
                    }
                });
            });
        });

        document.querySelectorAll('input[name="blobMode"]').forEach((elem) => {
            elem.addEventListener("change", function (e) {
                config.blobMode = e.target.value;
                const sizeVals = [16, 32, 64, 128, 256, 512];
                const countVals = [1, 2, 4, 8, 16, 32];
                let targetVals = config.blobMode === 'size' ? sizeVals : countVals;

                for (let i = 1; i <= 6; i++) {
                    const inp = document.getElementById('bv' + i);
                    const lbl = document.getElementById('lbl_bv' + i);
                    if (inp && lbl) {
                        inp.value = targetVals[i - 1];
                        lbl.textContent = targetVals[i - 1];
                    }
                }

                const activeVal = document.querySelector('input[name="blobVal"]:checked');
                if (activeVal) config.blobValue = parseInt(activeVal.value);
                if (isTracking && isStaticMedia) processStaticMedia();
            });
        });

        const thicknessEl = document.getElementById("thickness");
        if (thicknessEl) {
            thicknessEl.addEventListener("input", (e) => {
                config.thickness = parseInt(e.target.value);
                setElText("thicknessVal", config.thickness + "px");
                if (isTracking && isStaticMedia) renderVisuals();
            });
        }

        const fontSizeEl = document.getElementById("fontSize");
        if (fontSizeEl) {
            fontSizeEl.addEventListener("input", (e) => {
                config.fontSize = parseInt(e.target.value);
                setElText("fontSizeVal", config.fontSize + "px");
                if (isTracking && isStaticMedia) renderVisuals();
            });
        }

        // ==========================================
        // 10. FILE UPLOAD (IMAGE & VIDEO)
        // ==========================================
        const mediaUploadEl = document.getElementById('mediaUpload');
        if (mediaUploadEl) {
            mediaUploadEl.addEventListener('change', async (e) => {
                const file = e.target.files[0]; if (!file) return;
                if (audioCtx.state === 'suspended') audioCtx.resume();

                stopSystem();
                setElDisplay("cameraBtn", "none");
                setElDisplay("stopBtn", "block");
                setElText("statusText", "LOADING FILE...");

                currentUploadedBlobUrl = URL.createObjectURL(file);

                if (file.type.startsWith('image/')) {
                    const img = new Image();
                    img.onload = async () => {
                        if (canvas) {
                            canvas.width = img.naturalWidth;
                            canvas.height = img.naturalHeight;
                        }
                        activeMediaElement = document.createElement('canvas');
                        activeMediaElement.width = img.naturalWidth;
                        activeMediaElement.height = img.naturalHeight;
                        activeMediaElement.getContext('2d').drawImage(img, 0, 0);

                        isStaticMedia = true;
                        isTracking = true;

                        setElDisplay("autoRenderBtn", "block");
                        setElText("autoRenderBtn", "SIMPAN FOTO (HASIL)");
                        setElDisplay("playPauseBtn", "none");
                        await processStaticMedia();
                    };
                    img.src = currentUploadedBlobUrl;
                } else if (file.type.startsWith('video/')) {
                    if (video) {
                        video.src = currentUploadedBlobUrl;
                        video.loop = true;
                        video.muted = true;

                        video.onloadedmetadata = () => {
                            if (canvas) {
                                canvas.width = video.videoWidth;
                                canvas.height = video.videoHeight;
                            }
                            activeMediaElement = video;
                            isStaticMedia = false;
                            isTracking = true;

                            setElDisplay("autoRenderBtn", "block");
                            setElText("autoRenderBtn", "RENDER & SIMPAN UPLOAD");
                            setElDisplay("playPauseBtn", "block");

                            video.play().then(() => {
                                setElText("statusText", "VIDEO PREVIEW (PLAYING)");
                                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                                runTrackerLoop();
                            }).catch(err => {
                                console.warn("Autoplay ditolak:", err);
                                setElText("statusText", "KLIK PLAY UNTUK MEMULAI");
                            });
                        };
                    }
                }
            });
        }

        // ==========================================
        // 11. EXPORT & RECORD ENGINE
        // ==========================================
        const btnAutoRender = document.getElementById("autoRenderBtn");
        if (btnAutoRender) {
            btnAutoRender.addEventListener("click", () => {
                if (!activeMediaElement) return;

                if (isStaticMedia && canvas) {
                    const a = document.createElement('a');
                    a.download = `VFX_Export_${Date.now()}.png`;
                    a.href = canvas.toDataURL("image/png");
                    a.click();
                    showMsg("SELESAI", "Foto hasil visual efek berhasil disimpan.");
                } else if (!isStaticMedia && activeMediaElement.tagName === 'VIDEO' && canvas) {
                    activeMediaElement.loop = false;
                    activeMediaElement.currentTime = 0;
                    recordedChunks = [];

                    const canvasStream = canvas.captureStream(30);
                    const stream = new MediaStream(canvasStream.getVideoTracks());

                    try {
                        let audioStream = activeMediaElement.captureStream ? activeMediaElement.captureStream() :
                            (activeMediaElement.mozCaptureStream ? activeMediaElement.mozCaptureStream() : null);
                        if (audioStream && audioStream.getAudioTracks().length > 0) {
                            stream.addTrack(audioStream.getAudioTracks()[0]);
                        }
                    } catch (e) { }

                    const vfEl = document.getElementById("videoFormat");
                    let format = vfEl ? vfEl.value : "video/webm";
                    if (format === "video/mp4" && !MediaRecorder.isTypeSupported("video/mp4")) {
                        format = "video/webm";
                    }

                    try {
                        mediaRecorder = new MediaRecorder(stream, { mimeType: format });
                    } catch (e) {
                        mediaRecorder = new MediaRecorder(stream);
                        format = "video/webm";
                    }

                    mediaRecorder.ondataavailable = e => {
                        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
                    };

                    mediaRecorder.onstop = () => {
                        const ext = format.includes("mp4") ? "mp4" : "webm";
                        const blob = new Blob(recordedChunks, { type: format });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `VFX_Render_${Date.now()}.${ext}`;
                        a.click();
                        setTimeout(() => URL.revokeObjectURL(url), 2000);

                        showMsg("SELESAI", "Video sukses dirender dan disimpan!");
                        activeMediaElement.loop = true;
                        activeMediaElement.play();

                        btnAutoRender.textContent = "RENDER & SIMPAN UPLOAD";
                        btnAutoRender.style.color = "#8B5CF6";
                        btnAutoRender.disabled = false;
                    };

                    activeMediaElement.onended = () => {
                        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                    };

                    mediaRecorder.start();
                    activeMediaElement.play();

                    btnAutoRender.textContent = "RENDERING... (HARAP TUNGGU)";
                    btnAutoRender.style.color = "#EF4444";
                    btnAutoRender.disabled = true;
                }
            });
        }

        const btnSaveImg = document.getElementById("saveImgBtn");
        if (btnSaveImg && canvas) {
            btnSaveImg.addEventListener("click", () => {
                const a = document.createElement('a');
                a.download = `VFX_Snapshot_${Date.now()}.png`;
                a.href = canvas.toDataURL("image/png");
                a.click();
            });
        }

        const btnRecordVid = document.getElementById("recordVideoBtn");
        if (btnRecordVid && canvas) {
            btnRecordVid.addEventListener("click", () => {
                if (isRecording) {
                    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                    isRecording = false;
                    btnRecordVid.textContent = "REKAM KAMERA";
                    btnRecordVid.style.borderColor = "#EF4444";
                    btnRecordVid.style.color = "#EF4444";
                } else {
                    if (!isTracking) return showMsg("PERHATIAN", "Mulai kamera terlebih dahulu!");
                    recordedChunks = [];

                    const canvasStream = canvas.captureStream(30);
                    const stream = new MediaStream(canvasStream.getVideoTracks());

                    if (cameraStream && cameraStream.getAudioTracks().length > 0) {
                        stream.addTrack(cameraStream.getAudioTracks()[0]);
                    }

                    const vfEl = document.getElementById("videoFormat");
                    let format = vfEl ? vfEl.value : "video/webm";
                    if (format === "video/mp4" && !MediaRecorder.isTypeSupported("video/mp4")) {
                        format = "video/webm";
                        showMsg("INFO", "Browser tidak mendukung MP4, beralih ke WebM.");
                    }

                    try {
                        mediaRecorder = new MediaRecorder(stream, { mimeType: format });
                    } catch (e) {
                        mediaRecorder = new MediaRecorder(stream);
                        format = "video/webm";
                    }

                    mediaRecorder.ondataavailable = e => {
                        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
                    };

                    mediaRecorder.onstop = () => {
                        const ext = format.includes("mp4") ? "mp4" : "webm";
                        const blob = new Blob(recordedChunks, { type: format });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `VFX_LiveRec_${Date.now()}.${ext}`;
                        a.click();
                        setTimeout(() => URL.revokeObjectURL(url), 2000);
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btnRecordVid.textContent = "STOP REKAM";
                    btnRecordVid.style.borderColor = "#00FFFF";
                    btnRecordVid.style.color = "#00FFFF";
                }
            });
        }

        window.addEventListener('resize', () => {
            if (activeMediaElement && activeMediaElement.tagName === 'VIDEO' && activeMediaElement.videoWidth && canvas) {
                canvas.width = activeMediaElement.videoWidth;
                canvas.height = activeMediaElement.videoHeight;
                if (isTracking) renderVisuals();
            }
        });

        // PWA Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    reg.onupdatefound = () => {
                        const installingWorker = reg.installing;
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log('Versi baru aplikasi terinstal.');
                            }
                        };
                    };
                }).catch(() => { });
            });
        }
    </script>
</body>

</html>
